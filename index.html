<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratorium Maya — Ensiklopedia Interaktif</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* TOKENS */
:root{
  --bg:#F5F3EC;
  --bg-deep:#EFEBE0;
  --surface:#FFFFFF;
  --line:#DEDACB;
  --line-soft:#E9E5D8;
  --ink:#1C2A2E;
  --ink-soft:#57646A;
  --ink-faint:#8A9298;
  --primary:#254D52;
  --primary-ink:#123034;
  --primary-soft:#E4ECEA;
  --secondary:#5C7A4F;
  --secondary-soft:#E9EFE3;
  --accent:#B5652F;
  --accent-soft:#F3E2CF;
  --physical:#8C6A4E;
  --virtual:#2B6E63;
  --radius-s:6px;
  --radius-m:10px;
  --shadow:0 1px 2px rgba(28,42,46,.06), 0 6px 20px -8px rgba(28,42,46,.12);
  --dur-1:180ms;
  --dur-2:420ms;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  /* keep light theme intentionally — scientific-editorial look; no forced dark override */
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Fraunces', Georgia, serif;
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--primary-ink);
  margin:0 0 .5em;
}
p{margin:0 0 1em;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px;}

/* APP SHELL */
#app{min-height:100vh; display:flex; flex-direction:column;}

.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(245,243,236,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1180px; margin:0 auto; padding:14px 24px;
  display:flex; align-items:center; gap:20px;
}
.brand{
  display:flex; align-items:center; gap:10px;
  font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem;
  color:var(--primary-ink); cursor:pointer; white-space:nowrap;
  background:none; border:none; padding:0;
}
.brand-mark{width:26px; height:26px; flex-shrink:0;}
.brand-mark svg{width:100%; height:100%; display:block;}

.topnav{display:flex; align-items:center; gap:4px; flex:1;}
.topnav-link{
  background:none; border:none; cursor:pointer;
  font-size:.92rem; color:var(--ink-soft); padding:8px 12px;
  border-radius:var(--radius-s); transition:background var(--dur-1) var(--ease), color var(--dur-1);
}
.topnav-link:hover{background:var(--primary-soft); color:var(--primary-ink);}
.topnav-link[aria-current="true"]{color:var(--primary-ink); font-weight:600;}

.topbar-right{display:flex; align-items:center; gap:10px; margin-left:auto;}
.icon-btn{
  background:none; border:1px solid transparent; cursor:pointer;
  width:36px; height:36px; border-radius:var(--radius-s);
  display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft); transition:background var(--dur-1), border-color var(--dur-1);
}
.icon-btn:hover{background:var(--primary-soft); border-color:var(--line);}
.icon-btn svg{width:18px; height:18px;}

.lang-switch{
  display:flex; border:1px solid var(--line); border-radius:20px; overflow:hidden;
  font-size:.8rem; font-weight:600; font-family:'IBM Plex Mono', monospace;
}
.lang-switch button{
  background:var(--surface); border:none; padding:6px 12px; cursor:pointer;
  color:var(--ink-faint); transition:background var(--dur-1), color var(--dur-1);
}
.lang-switch button.active{background:var(--primary); color:#fff;}

.hamburger{display:none;}

/* MAIN */
main{flex:1; width:100%;}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px;}

/* HOME */
.hero{
  padding:76px 24px 64px;
  position:relative;
  overflow:hidden;
  border-bottom:1px solid var(--line);
}
.hero-grid{
  max-width:1180px; margin:0 auto;
  display:grid; grid-template-columns:1.1fr .9fr; gap:56px; align-items:center;
}
.hero-eyebrow{
  font-size:.82rem; color:var(--secondary); font-weight:600; margin-bottom:14px;
  display:flex; align-items:center; gap:8px;
}
.hero-eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--secondary); display:inline-block;}
.hero h1{font-size:clamp(2.3rem,5vw,3.4rem); line-height:1.05; margin-bottom:18px;}
.hero .sub{font-size:1.12rem; color:var(--ink-soft); max-width:46ch; margin-bottom:14px; font-family:'Fraunces',serif; font-weight:400; font-style:italic;}
.hero .desc{font-size:1rem; color:var(--ink-soft); max-width:54ch; margin-bottom:32px;}
.hero-ctas{display:flex; gap:14px; flex-wrap:wrap;}
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:13px 22px; border-radius:var(--radius-s); font-size:.95rem; font-weight:600;
  cursor:pointer; border:1px solid transparent; transition:transform var(--dur-1) var(--ease), background var(--dur-1);
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-ink);}
.btn-ghost{background:transparent; color:var(--primary-ink); border-color:var(--line);}
.btn-ghost:hover{background:var(--primary-soft);}

.hero-visual{position:relative; aspect-ratio:1/1; max-width:420px; justify-self:center;}
.hero-visual svg{width:100%; height:100%;}

.hero-stats{
  max-width:1180px; margin:56px auto 0; display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden;
}
.stat{background:var(--surface); padding:20px 22px;}
.stat b{display:block; font-family:'Fraunces',serif; font-size:1.6rem; color:var(--primary-ink);}
.stat span{font-size:.82rem; color:var(--ink-faint);}

/* ============ TOC ============ */
.toc-section{padding:56px 24px 80px;}
.section-head{max-width:640px; margin-bottom:36px;}
.section-head .kicker{font-size:.82rem; color:var(--secondary); font-weight:600; margin-bottom:10px;}
.section-head h2{font-size:2rem;}
.section-head p{color:var(--ink-soft);}

.toc-list{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden;}
.toc-item{
  background:var(--surface); padding:22px 24px; display:grid; grid-template-columns:56px 1fr auto; gap:20px; align-items:center;
  cursor:pointer; border:none; text-align:left; width:100%; transition:background var(--dur-1);
}
.toc-item:hover{background:var(--primary-soft);}
.toc-num{font-family:'Fraunces',serif; font-size:1.5rem; color:var(--line-soft); font-weight:600; transition:color var(--dur-1);}
.toc-item:hover .toc-num{color:var(--secondary);}
.toc-text h3{font-size:1.08rem; margin-bottom:4px;}
.toc-text p{font-size:.9rem; color:var(--ink-soft); margin:0;}
.toc-arrow{color:var(--ink-faint); transition:transform var(--dur-1) var(--ease);}
.toc-item:hover .toc-arrow{transform:translateX(4px); color:var(--secondary);}

/* ============ SECTION PAGE ============ */
.section-page{padding:44px 24px 40px; min-height:60vh;}
.section-layout{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:230px 1fr; gap:48px;}
.mini-toc{position:sticky; top:80px; align-self:start;}
.mini-toc-title{font-size:.75rem; text-transform:none; color:var(--ink-faint); font-weight:600; margin-bottom:10px; letter-spacing:.02em;}
.mini-toc-list{display:flex; flex-direction:column; gap:2px;}
.mini-toc-list button{
  text-align:left; background:none; border:none; cursor:pointer; padding:8px 10px; border-radius:var(--radius-s);
  font-size:.86rem; color:var(--ink-faint); display:flex; gap:10px; align-items:baseline; transition:background var(--dur-1), color var(--dur-1);
}
.mini-toc-list button:hover{background:var(--primary-soft); color:var(--ink);}
.mini-toc-list button[aria-current="true"]{color:var(--primary-ink); font-weight:600; background:var(--primary-soft);}
.mini-toc-list span.n{font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--ink-faint); width:16px; flex-shrink:0;}

.section-content{min-width:0;}
.section-eyebrow{display:flex; align-items:center; gap:10px; font-size:.82rem; color:var(--secondary); font-weight:600; margin-bottom:14px;}
.section-content h2{font-size:2.1rem; margin-bottom:22px;}

.content-fade{animation:fadeUp var(--dur-2) var(--ease);}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

.block{margin-bottom:30px;}
.block p{color:var(--ink-soft); max-width:70ch;}
.block ul{margin:0 0 1em; padding-left:20px; color:var(--ink-soft); max-width:66ch;}
.block li{margin-bottom:6px;}

/* highlight box */
.highlight-box{
  background:var(--secondary-soft); border:1px solid #D2E0C6; border-radius:var(--radius-m);
  padding:26px 28px; margin:8px 0 30px;
}
.highlight-box .tag{font-size:.78rem; font-weight:700; color:var(--secondary); text-transform:none; margin-bottom:8px; display:block;}
.highlight-box h3{font-size:1.3rem; margin-bottom:8px;}
.highlight-box p{margin:0; color:var(--ink-soft);}

/* theory / discipline / platform / taxonomy cards */
.card-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.flip-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:22px 20px; cursor:pointer; transition:border-color var(--dur-1), box-shadow var(--dur-1);
}
.flip-card:hover, .flip-card.open{border-color:var(--secondary); box-shadow:var(--shadow);}
.flip-card .letter{
  width:34px; height:34px; border-radius:8px; background:var(--primary-soft); color:var(--primary-ink);
  display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; margin-bottom:14px;
}
.flip-card h4{font-size:1.02rem; margin-bottom:4px;}
.flip-card .who{font-size:.8rem; color:var(--ink-faint); margin-bottom:10px;}
.flip-card .body{font-size:.88rem; color:var(--ink-soft); max-height:0; overflow:hidden; transition:max-height var(--dur-2) var(--ease);}
.flip-card.open .body{max-height:400px;}
.flip-card .toggle-hint{font-size:.76rem; color:var(--accent); font-weight:600; margin-top:8px; display:inline-block;}

/* flow diagram */
.flow{display:flex; flex-direction:column; gap:0; max-width:520px; margin:8px 0 10px;}
.flow-step{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-s);
  padding:16px 18px; position:relative; cursor:pointer; transition:border-color var(--dur-1), background var(--dur-1);
}
.flow-step:hover, .flow-step.open{border-color:var(--primary); background:var(--primary-soft);}
.flow-step .fs-top{display:flex; align-items:center; gap:12px;}
.flow-step .fs-idx{
  width:26px; height:26px; border-radius:50%; background:var(--primary); color:#fff; font-size:.78rem;
  display:flex; align-items:center; justify-content:center; font-weight:600; flex-shrink:0;
}
.flow-step h4{font-size:.96rem; margin:0;}
.flow-step .fs-desc{font-size:.85rem; color:var(--ink-soft); max-height:0; overflow:hidden; transition:max-height var(--dur-2) var(--ease); padding-left:38px;}
.flow-step.open .fs-desc{max-height:200px; margin-top:8px;}
.flow-connector{width:2px; height:20px; background:var(--line); margin-left:31px;}
.flow-connector.horizontal-hide{display:none;}

/* comparison table */
.compare-wrap{border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; background:var(--surface);}
table.compare{width:100%; border-collapse:collapse; font-size:.9rem;}
table.compare thead th{
  background:var(--bg-deep); text-align:left; padding:14px 18px; font-family:'Fraunces',serif; font-weight:600; color:var(--primary-ink);
  border-bottom:1px solid var(--line);
}
table.compare th:first-child, table.compare td:first-child{width:22%; color:var(--ink-soft); font-weight:600; font-size:.85rem;}
table.compare td{padding:14px 18px; border-bottom:1px solid var(--line-soft); vertical-align:top; color:var(--ink-soft);}
table.compare tbody tr:last-child td{border-bottom:none;}
table.compare td.physical{border-left:3px solid var(--physical);}
table.compare td.virtual{border-left:3px solid var(--virtual);}

.compare-cards{display:none;}
.compare-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px 20px; margin-bottom:14px;}
.compare-card h4{font-size:.95rem; margin-bottom:12px; color:var(--primary-ink);}
.compare-row{padding:10px 0; border-top:1px solid var(--line-soft);}
.compare-row:first-of-type{border-top:none;}
.compare-row .lbl{font-size:.72rem; font-weight:700; color:var(--ink-faint); margin-bottom:3px; display:flex; align-items:center; gap:6px;}
.compare-row .lbl.physical::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--physical);}
.compare-row .lbl.virtual::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--virtual);}
.compare-row .val{font-size:.87rem; color:var(--ink-soft);}

/* taxonomy timeline */
.taxo-list{display:flex; flex-direction:column; gap:14px;}
.taxo-item{
  display:grid; grid-template-columns:64px 1fr; gap:18px; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius-m); padding:20px 22px;
}
.taxo-vis{display:flex; align-items:center; justify-content:center;}
.taxo-vis svg{width:52px; height:52px;}
.taxo-item h4{font-size:1.02rem; margin-bottom:6px;}
.taxo-item p{font-size:.88rem; color:var(--ink-soft); margin-bottom:10px;}
.taxo-meta{display:flex; flex-wrap:wrap; gap:8px;}
.taxo-tag{font-size:.74rem; background:var(--bg-deep); color:var(--ink-soft); padding:4px 10px; border-radius:20px; border:1px solid var(--line);}

/* discipline cards */
.disc-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
.disc-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:20px 22px;}
.disc-card .icon{width:30px; height:30px; margin-bottom:12px; color:var(--secondary);}
.disc-card .icon svg{width:100%; height:100%;}
.disc-card h4{font-size:1rem; margin-bottom:8px;}
.disc-card ul{margin:0; padding-left:18px; font-size:.87rem;}

/* platform cards */
.plat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
.plat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:20px 22px;}
.plat-card h4{font-size:1.02rem; margin-bottom:2px;}
.plat-card .focus{font-size:.8rem; color:var(--accent); font-weight:600; margin-bottom:10px;}
.plat-card p{font-size:.87rem; color:var(--ink-soft); margin-bottom:8px;}
.plat-card .who{font-size:.78rem; color:var(--ink-faint); border-top:1px solid var(--line-soft); padding-top:8px; margin-top:10px;}

/* conclusion flow (horizontal on desktop) */
.cflow{display:flex; flex-direction:column; gap:2px; margin:22px 0 14px;}
.cflow-row{
  display:grid; grid-template-columns:1fr auto 1fr auto 1fr; align-items:stretch; gap:0 10px;
}
.cflow-node{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-s); padding:14px 12px;
  font-size:.84rem; text-align:center; display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft); font-weight:600; min-height:64px; line-height:1.3;
}
.cflow-node.emph{background:var(--primary); color:#fff; border-color:var(--primary);}
.cflow-arrow{display:flex; align-items:center; justify-content:center; color:var(--ink-faint); flex-shrink:0;}
.cflow-arrow svg{width:18px; height:18px;}
.cflow-connector{display:flex; justify-content:center; align-items:center; color:var(--ink-faint); padding:2px 0;}
.cflow-connector svg{width:18px; height:18px; transform:rotate(90deg);}
@media (max-width:680px){
  .cflow-row{grid-template-columns:1fr;}
  .cflow-row .cflow-arrow{transform:rotate(90deg); margin:2px 0;}
}

/* FOOTER NAV (section pages) */
.footer-nav{
  position:sticky; bottom:0; z-index:30; background:rgba(245,243,236,.94); backdrop-filter:blur(10px);
  border-top:1px solid var(--line); padding:14px 24px;
}
.footer-nav-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:20px;}
.fn-btn{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
  padding:10px 16px; border-radius:var(--radius-s); cursor:pointer; font-size:.88rem; font-weight:600; color:var(--ink);
  transition:background var(--dur-1), border-color var(--dur-1);
}
.fn-btn:hover:not(:disabled){border-color:var(--primary); background:var(--primary-soft);}
.fn-btn:disabled{opacity:.35; cursor:not-allowed;}
.fn-btn.next{margin-left:auto;}
.fn-progress{flex:1; max-width:280px; display:flex; flex-direction:column; gap:5px; align-items:center;}
.fn-progress-track{width:100%; height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
.fn-progress-bar{height:100%; background:var(--secondary); border-radius:2px; transition:width var(--dur-2) var(--ease);}
.fn-progress-label{font-size:.74rem; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace;}

/* ============ REGULAR FOOTER  */
footer.site-footer{border-top:1px solid var(--line); padding:40px 24px; margin-top:auto;}
.site-footer-inner{max-width:1180px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;}
.site-footer p{margin:0; font-size:.85rem; color:var(--ink-faint);}

/* ============ SEARCH OVERLAY ============ */
.search-overlay{
  position:fixed; inset:0; background:rgba(18,48,52,.4); z-index:100;
  display:flex; align-items:flex-start; justify-content:center; padding:10vh 20px;
  opacity:0; pointer-events:none; transition:opacity var(--dur-2) var(--ease);
}
.search-overlay.show{opacity:1; pointer-events:auto;}
.search-panel{
  background:var(--surface); border-radius:var(--radius-m); width:100%; max-width:620px;
  box-shadow:0 20px 60px -10px rgba(0,0,0,.3); overflow:hidden;
  transform:translateY(-14px); transition:transform var(--dur-2) var(--ease);
  max-height:70vh; display:flex; flex-direction:column;
}
.search-overlay.show .search-panel{transform:translateY(0);}
.search-input-row{display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line);}
.search-input-row svg{width:18px; height:18px; color:var(--ink-faint); flex-shrink:0;}
.search-input-row input{
  border:none; outline:none; flex:1; font-size:1.05rem; font-family:inherit; background:none; color:var(--ink);
}
.search-clear{background:none; border:none; cursor:pointer; color:var(--ink-faint); padding:4px; display:none;}
.search-clear.show{display:flex;}
.search-results{overflow-y:auto; padding:8px;}
.search-result{
  display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
  padding:12px 14px; border-radius:var(--radius-s); transition:background var(--dur-1);
}
.search-result:hover{background:var(--primary-soft);}
.search-result .sr-meta{font-size:.72rem; color:var(--secondary); font-weight:700; margin-bottom:3px;}
.search-result .sr-title{font-size:.95rem; font-weight:600; margin-bottom:3px; color:var(--ink);}
.search-result .sr-snip{font-size:.82rem; color:var(--ink-soft);}
.search-result mark{background:var(--accent-soft); color:var(--accent); padding:0 2px; border-radius:2px;}
.search-empty{padding:36px 20px; text-align:center; color:var(--ink-faint); font-size:.9rem;}
.search-hint{padding:14px 20px; font-size:.78rem; color:var(--ink-faint); border-top:1px solid var(--line);}
.search-count{font-size:.72rem; color:var(--ink-faint); padding:10px 14px 4px;}

/* ============ RESPONSIVE ============ */
@media (max-width:920px){
  .card-grid{grid-template-columns:1fr 1fr;}
  .disc-grid, .plat-grid{grid-template-columns:1fr;}
  .section-layout{grid-template-columns:1fr;}
  .mini-toc{display:none;}
  .hero-grid{grid-template-columns:1fr; text-align:left;}
  .hero-visual{max-width:280px; margin-top:20px;}
  .hero-stats{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:680px){
  .card-grid{grid-template-columns:1fr;}
  table.compare{display:none;}
  .compare-cards{display:block;}
  .topnav{display:none;}
  .hamburger{display:flex;}
  .topbar-inner{padding:12px 16px;}
  .wrap, .toc-section, .section-page, .hero{padding-left:16px; padding-right:16px;}
  .section-content h2{font-size:1.6rem;}
  .fn-btn span.txt{display:none;}
  .fn-progress{max-width:none;}
}
.mobile-menu{

/* build plain-text search index per language, lazily */
const searchIndexCache = {};
function stripTags(html){ return html.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim(); }
function sectionSearchText(section){
  let parts = [section.title, section.tagline];
  section.blocks.forEach(b=>{
    if(b.type==="p") parts.push(b.text);
    if(b.type==="list") parts.push(b.items.join(" "));
    if(b.type==="theoryCards") b.cards.forEach(c=>parts.push(c.title,c.who,c.text));
    if(b.type==="flow") b.steps.forEach(s=>parts.push(s.label,s.desc));
    if(b.type==="compare") b.rows.forEach(r=>parts.push(r.label,r.physical,r.virtual));
    if(b.type==="taxonomy") b.items.forEach(t=>parts.push(t.title,t.desc,(t.tags||[]).join(" ")));
    if(b.type==="disciplines") b.items.forEach(x=>parts.push(x.title,x.items.join(" ")));
    if(b.type==="platforms") b.items.forEach(x=>parts.push(x.name,x.focus,x.desc,x.who));
    if(b.type==="highlight") parts.push(b.tag,b.title,b.text);
    if(b.type==="cflow") parts.push(b.nodes.join(" "));
  });
  return parts.join(" ");
}
function getSearchIndex(){
  if(searchIndexCache[state.lang]) return searchIndexCache[state.lang];
  const idx = d().sections.map(s=>({section:s, text:sectionSearchText(s)}));
  searchIndexCache[state.lang]=idx;
  return idx;
}
function runSearch(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const idx = getSearchIndex();
  const results=[];
  idx.forEach(entry=>{
    const lower = entry.text.toLowerCase();
    const pos = lower.indexOf(q);
    if(pos!==-1){
      const start = Math.max(0,pos-40);
      const end = Math.min(entry.text.length,pos+q.length+60);
      let snip = entry.text.slice(start,end);
      if(start>0) snip="…"+snip;
      if(end<entry.text.length) snip=snip+"…";
      const re = new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
      snip = escapeHtml(snip).replace(re, m=>`<mark>${m}</mark>`);
      results.push({section:entry.section, snip});
    }
  });
  return results;
}
function escapeHtml(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderSectionPage(number){
  const t = ui();
  const section = d().sections.find(s=>s.number===number) || d().sections[0];
  const total = d().sections.length;
  return `
  <section class="section-page">
    <div class="section-layout">
      <aside class="mini-toc">
        <div class="mini-toc-title">${t.miniTocTitle}</div>
        <div class="mini-toc-list">

function renderBlock(b, key){
  if(b.type==="p") return `<div class="block"><p>${b.text}</p></div>`;
  if(b.type==="list") return `<div class="block"><ul>${b.items.map(it=>`<li>${it}</li>`).join("")}</ul></div>`;
  if(b.type==="highlight") return `<div class="block"><div class="highlight-box"><span class="tag">${b.tag}</span><h3>${b.title}</h3><p>${b.text}</p></div></div>`;
  if(b.type==="theoryCards") return `<div class="block"><div class="card-grid">${b.cards.map((c,i)=>renderTheoryCard(c,key+"-"+i)).join("")}</div></div>`;
  if(b.type==="flow") return `<div class="block">${renderFlow(b.steps, key, b.compact)}</div>`;
  if(b.type==="compare") return `<div class="block">${renderCompare(b.rows)}</div>`;
  if(b.type==="taxonomy") return `<div class="block">${renderTaxonomy(b.items)}</div>`;
  if(b.type==="disciplines") return `<div class="block">${renderDisciplines(b.items)}</div>`;
  if(b.type==="platforms") return `<div class="block">${renderPlatforms(b.items)}</div>`;
  if(b.type==="cflow") return `<div class="block">${renderCFlow(b.nodes,b.emph||[])}</div>`;
  return "";
}

function renderTheoryCard(c, ckey){
  const open = !!state.openCards[ckey];
  return `
  <div class="flip-card ${open?'open':''}" data-toggle="${ckey}">
    <div class="letter">${c.letter}</div>
    <h4>${c.title}</h4>
    <div class="who">${c.who}</div>
    <div class="body">${c.text}</div>
    <span class="toggle-hint">${open ? (state.lang==='id'?'Tutup ▲':'Close ▲') : (state.lang==='id'?'Baca selengkapnya ▼':'Read more ▼')}</span>

}

function renderFlow(steps, key, compact){
  return `<div class="flow">

      const open = !!state.openCards[skey];
      return `
      <div>
        <div class="flow-step ${open?'open':''}" data-toggle="${skey}">
          <div class="fs-top"><span class="fs-idx">${i+1}</span><h4>${s.label}</h4></div>
          <div class="fs-desc">${s.desc}</div>
        </div>
        ${i<steps.length-1 ? '<div class="flow-connector"></div>' : ''}

    }).join("")}

}

function renderCompare(rows){
  const t = ui();
  const physLabel = state.lang==='id' ? 'Laboratorium Fisik' : 'Physical Laboratory';
  const virtLabel = state.lang==='id' ? 'Laboratorium Maya' : 'Virtual Laboratory';
  const table = `

const TAXO_ICONS = [ICONS.flask2d, ICONS.vr, ICONS.remote];
function renderTaxonomy(items){
  return `<div class="taxo-list">
    ${items.map((it,i)=>`
      <div class="taxo-item">
        <div class="taxo-vis">${TAXO_ICONS[i]||ICONS.flask2d}</div>

function renderDisciplines(items){

    ${items.map((it,i)=>`

function renderPlatforms(items){
  return `<div class="plat-grid">
    ${items.map(it=>`
      <div class="plat-card">
        <h4>${it.name}</h4>
        <div class="focus">${it.focus}</div>

        <div class="who">${it.who}</div>

function renderCFlow(nodes, emph, perRow){
  const size = perRow || 3;
  const rows = [];
  for(let i=0;i<nodes.length;i+=size) rows.push(nodes.slice(i,i+size).map((n,j)=>({n, idx:i+j})));
  const rowHtml = row => `<div class="cflow-row">
    ${row.map((item,j)=>`
      ${j>0 ? `<div class="cflow-arrow">${ICONS.arrowRight}</div>` : ''}
      <div class="cflow-node ${emph.includes(item.idx)?'emph':''}">${item.n}</div>
    `).join("")}
  </div>`;
  const parts = [];
  rows.forEach((row,i)=>{
    parts.push(rowHtml(row));
    if(i<rows.length-1) parts.push(`<div class="cflow-connector">${ICONS.arrowRight}</div>`);
  });
  return `<div class="cflow">${parts.join("")}</div>`;
}

      </div>

    </div>
  </div>`;
}

/* =========================================================================
   EVENTS
   ========================================================================= */
function attachEvents(){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const view = el.getAttribute("data-nav");
      if(view==="section"){
        goSection(parseInt(el.getAttribute("data-num"),10));
      } else {
        navigate({view});
      }
    });
  });

  document.querySelectorAll("[data-lang]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.lang = el.getAttribute("data-lang");
      render();
    });
  });

  document.querySelectorAll("[data-toggle]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const k = el.getAttribute("data-toggle");
      state.openCards[k] = !state.openCards[k];
      render();
    });
  });

  const prevBtn = document.querySelector('[data-action="prev"]');
  if(prevBtn) prevBtn.addEventListener("click", ()=>{
    if(state.route.view==="section" && state.route.number>1) goSection(state.route.number-1);
  });
  const nextBtn = document.querySelector('[data-action="next"]');
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    const total = d().sections.length;
    if(state.route.view==="section"){
      if(state.route.number>=total) navigate({view:"toc"});
      else goSection(state.route.number+1);
    }
  });

  const openSearchBtn = document.querySelector('[data-action="open-search"]');
  if(openSearchBtn) openSearchBtn.addEventListener("click", openSearch);
  const openSearchMenu = document.querySelector('[data-action="open-search-from-menu"]');
  if(openSearchMenu) openSearchMenu.addEventListener("click", ()=>{ state.mobileMenuOpen=false; openSearch(); });

  const menuBtn = document.querySelector('[data-action="open-menu"]');
  if(menuBtn) menuBtn.addEventListener("click", ()=>{ state.mobileMenuOpen=true; render(); focusNothing(); });
  document.querySelectorAll('[data-action="close-menu"]').forEach(el=>el.addEventListener("click", ()=>{ state.mobileMenuOpen=false; render(); }));

  const searchBackdrop = document.querySelector('[data-action="close-search-backdrop"]');
  if(searchBackdrop) searchBackdrop.addEventListener("click", (e)=>{
    if(e.target===searchBackdrop){ closeSearch(); }
  });
  const clearBtn = document.querySelector('[data-action="clear-search"]');
  if(clearBtn) clearBtn.addEventListener("click", ()=>{ state.searchQuery=""; render(); focusSearchInput(); });

  const input = document.getElementById("search-input");
  if(input){
    input.addEventListener("input", (e)=>{
      state.searchQuery = e.target.value;
      renderSearchOnly();
    });
  }
  if(state.searchOpen) focusSearchInput();
}

function renderSearchOnly(){
  // re-render only the search overlay portion to keep input focus smooth
  const overlays = document.querySelectorAll(".search-overlay, .mobile-backdrop, .mobile-menu");
  const wrapper = document.getElementById("app");
  const searchHTML = renderSearchOverlay();
  const old = document.querySelector(".search-overlay");
  if(old){
    const temp = document.createElement("div");
    temp.innerHTML = searchHTML;
    old.replaceWith(temp.firstElementChild);
    attachSearchOnlyEvents();
    focusSearchInput();
  }
}
function attachSearchOnlyEvents(){
  document.querySelectorAll('.search-overlay [data-nav]').forEach(el=>{
    el.addEventListener("click", ()=>{
      const view = el.getAttribute("data-nav");
      if(view==="section") goSection(parseInt(el.getAttribute("data-num"),10));
    });
  });
  const searchBackdrop = document.querySelector('[data-action="close-search-backdrop"]');
  if(searchBackdrop) searchBackdrop.addEventListener("click", (e)=>{ if(e.target===searchBackdrop) closeSearch(); });
  const clearBtn = document.querySelector('[data-action="clear-search"]');
  if(clearBtn) clearBtn.addEventListener("click", ()=>{ state.searchQuery=""; renderSearchOnly(); });
  const input = document.getElementById("search-input");
  if(input) input.addEventListener("input",(e)=>{ state.searchQuery=e.target.value; renderSearchOnly(); });
}

function openSearch(){ state.searchOpen=true; render(); }
function closeSearch(){ state.searchOpen=false; state.searchQuery=""; render(); }
function focusSearchInput(){ const el=document.getElementById("search-input"); if(el){ el.focus(); const v=el.value; el.value=""; el.value=v; } }
function focusNothing(){}

/* ---------- KEYBOARD NAVIGATION ---------- */
document.addEventListener("keydown", (e)=>{
  const tag = (e.target.tagName||"").toLowerCase();
  const typing = tag==="input" || tag==="textarea";

  if(e.key==="Escape"){
    if(state.searchOpen){ closeSearch(); return; }
    if(state.mobileMenuOpen){ state.mobileMenuOpen=false; render(); return; }
  }
  if(typing) return;

  if(e.key==="Home"){
    e.preventDefault();
    navigate({view:"home"});
    return;
  }
  if(state.route.view==="section"){
    const total = d().sections.length;
    if(e.key==="ArrowRight"){
      e.preventDefault();
      if(state.route.number<total) goSection(state.route.number+1);
      else navigate({view:"toc"});
    }
    if(e.key==="ArrowLeft"){
      e.preventDefault();
      if(state.route.number>1) goSection(state.route.number-1);
    }
  }
});

/* =========================================================================
   INIT
   ========================================================================= */
render();
</script>
</body>
