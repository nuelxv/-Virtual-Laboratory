/* ---------- SECTION PAGE ---------- */
function renderSectionPage(number){
  const t = ui();
  const section = d().sections.find(s=>s.number===number) || d().sections[0];
  const total = d().sections.length;
  if(!memory.visitedSections.includes(section.number)){
    memory.visitedSections = memory.visitedSections.concat([section.number]);
    persistMemory();
  }
  setActiveTopic(section.title, section);
  return `
  <section class="section-page"><div class="section-layout">
    <aside class="mini-toc">
      <div class="mini-toc-title">${t.miniTocTitle}</div>
      <div class="mini-toc-list">
        ${d().sections.map(s=>`<button data-nav="section" data-num="${s.number}" aria-current="${s.number===number}"><span class="n">${String(s.number).padStart(2,"0")}</span>${s.title}</button>`).join("")}
      </div>
    </aside>
    <div class="section-content content-fade">
      <div class="section-eyebrow">${t.sectionWord} ${section.number} ${t.ofWord} ${total}</div>
      <h2>${section.title}</h2>
      ${section.blocks.map((b,i)=>renderBlock(b, section.id+"-"+i)).join("")}
    </div>
  </div></section>`;
}
function renderBlock(b, key){
  if(b.type==="p") return `<div class="block"><p>${b.text}</p></div>`;
  if(b.type==="list") return `<div class="block"><ul>${b.items.map(it=>`<li>${it}</li>`).join("")}</ul></div>`;
  if(b.type==="highlight") return `<div class="block"><div class="highlight-box"><span class="tag">${b.tag}</span><h3>${b.title}</h3><p>${b.text}</p></div></div>`;
  if(b.type==="theoryCards") return `<div class="block"><div class="card-grid">${b.cards.map((c,i)=>renderTheoryCard(c,key+"-"+i)).join("")}</div></div>`;
  if(b.type==="flow") return `<div class="block">${renderFlow(b.steps, key)}</div>`;
  if(b.type==="compare") return `<div class="block">${renderCompare(b.rows)}</div>`;
  if(b.type==="taxonomy") return `<div class="block">${renderTaxonomy(b.items)}</div>`;
  if(b.type==="disciplines") return `<div class="block">${renderDisciplines(b.items)}</div>`;
  if(b.type==="platforms") return `<div class="block">${renderPlatforms(b.items)}</div>`;
  if(b.type==="cflow") return `<div class="block">${renderCFlow(b.nodes,b.emph||[])}</div>`;
  return "";
}
function renderTheoryCard(c, ckey){
  const open = !!state.openCards[ckey];
  return `<div class="flip-card ${open?'open':''}" data-toggle="${ckey}">
    <div class="letter">${c.letter}</div><h4>${c.title}</h4><div class="who">${c.who}</div>
    <div class="body">${c.text}</div>
    <span class="toggle-hint">${open ? (state.lang==='id'?'Tutup ▲':'Close ▲') : (state.lang==='id'?'Baca selengkapnya ▼':'Read more ▼')}</span>
  </div>`;
}
function renderFlow(steps, key){
  return `<div class="flow">${steps.map((s,i)=>{
    const skey = key+"-flow-"+i; const open = !!state.openCards[skey];
    return `<div><div class="flow-step ${open?'open':''}" data-toggle="${skey}">
      <div class="fs-top"><span class="fs-idx">${i+1}</span><h4>${s.label}</h4></div>
      <div class="fs-desc">${s.desc}</div></div>
      ${i<steps.length-1 ? '<div class="flow-connector"></div>' : ''}</div>`;
  }).join("")}</div>`;
}
function renderCompare(rows){
  const physLabel = state.lang==='id' ? 'Laboratorium Fisik' : 'Physical Laboratory';
  const virtLabel = state.lang==='id' ? 'Laboratorium Maya' : 'Virtual Laboratory';
  const table = `<div class="compare-wrap"><table class="compare"><thead><tr><th></th><th>${physLabel}</th><th>${virtLabel}</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${r.label}</td><td class="physical">${r.physical}</td><td class="virtual">${r.virtual}</td></tr>`).join("")}</tbody></table></div>`;
  const cards = `<div class="compare-cards">${rows.map(r=>`
    <div class="compare-card"><h4>${r.label}</h4>
      <div class="compare-row"><div class="lbl physical">${physLabel}</div><div class="val">${r.physical}</div></div>
      <div class="compare-row"><div class="lbl virtual">${virtLabel}</div><div class="val">${r.virtual}</div></div>
    </div>`).join("")}</div>`;
  return table+cards;
}
const TAXO_ICONS_ARR=[ICONS.flask2d,ICONS.vr,ICONS.remote];
function renderTaxonomy(items){
  return `<div class="taxo-list">${items.map((it,i)=>`
    <div class="taxo-item"><div class="taxo-vis">${TAXO_ICONS_ARR[i]||ICONS.flask2d}</div>
      <div><h4>${it.letter}. ${it.title}</h4><p>${it.desc}</p>
        <div class="taxo-meta">${(it.tags||[]).map(tg=>`<span class="taxo-tag">${tg}</span>`).join("")}</div>
      </div></div>`).join("")}</div>`;
}
const DISC_ICONS_ARR=[ICONS.chem,ICONS.physics,ICONS.bio,ICONS.eng];
function renderDisciplines(items){
  return `<div class="disc-grid">${items.map((it,i)=>`
    <div class="disc-card"><div class="icon">${DISC_ICONS_ARR[i]||ICONS.chem}</div><h4>${it.title}</h4>
      <ul>${it.items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>`;
}
function renderPlatforms(items){
  return `<div class="plat-grid">${items.map(it=>`
    <div class="plat-card"><h4>${it.name}</h4><div class="focus">${it.focus}</div><p>${it.desc}</p><div class="who">${it.who}</div></div>`).join("")}</div>`;
}
function renderCFlow(nodes, emph, perRow){
  const size = perRow || 3;
  const rows = [];
  for(let i=0;i<nodes.length;i+=size) rows.push(nodes.slice(i,i+size).map((n,j)=>({n, idx:i+j})));
  const rowHtml = row => `<div class="cflow-row">${row.map((item,j)=>`
      ${j>0 ? `<div class="cflow-arrow">${ICONS.arrowRight}</div>` : ''}
      <div class="cflow-node ${emph.includes(item.idx)?'emph':''}">${item.n}</div>`).join("")}</div>`;
  const parts=[];
  rows.forEach((row,i)=>{ parts.push(rowHtml(row)); if(i<rows.length-1) parts.push(`<div class="cflow-connector">${ICONS.arrowRight}</div>`); });
  return `<div class="cflow">${parts.join("")}</div>`;
}

function renderSearchOverlay(){
  const t = ui();

  if(!q){ body = `<div class="search-hint">${state.lang==='id' ? 'Ketik untuk mencari di seluruh 8 bagian materi.' : 'Type to search across all 8 content sections.'}</div>`; }

  return `<div class="search-overlay ${state.searchOpen?'show':''}" data-action="close-search-backdrop">

}

/* ---------- QUIZERU ---------- */
function renderQuizView(){
  const qz = state.quiz;
  if(qz.stage==="mode" || !qz.mode) return renderQuizModeSelect();
  if(qz.stage==="question") return renderQuizQuestion();
  if(qz.stage==="result") return renderQuizResult();
  return renderQuizModeSelect();
}
function renderQuizModeSelect(){
  const t = ui();
  const modeLabel = {
    easy: state.lang==='id'?'Mudah':'Easy',
    medium: state.lang==='id'?'Sedang':'Medium',
    hard: state.lang==='id'?'Sulit':'Hard'
  };
  return `<div class="quiz-page">
    <div class="quiz-intro">
      <div class="icon-big">${ICONS.quiz}</div>
      <h2>◉ Quizeru</h2>
      <p>${t.quizIntroDesc}</p>
    </div>
    <div class="mode-grid">
      ${Object.keys(QUIZ_MODES).map(m=>`
        <button class="mode-card" data-action="select-mode" data-mode="${m}">
          <div class="mode-name">${modeLabel[m]}</div>
          <div class="mode-count">${QUIZ_MODES[m]} ${state.lang==='id'?'soal':'questions'}</div>
        </button>`).join("")}
    </div>
  </div>`;
}
function renderQuizQuestion(){
  const t = ui();
  const qz = state.quiz;
  const q = qz.questions[qz.index];
  const total = qz.questions.length;
  const pct = Math.round(((qz.index)/total)*100 + (qz.answered ? (100/total) : 0));
  const letters = ["A","B","C","D"];
  const section = d().sections.find(s=>s.number===q.section);
  return `<div class="quiz-page">
    <div class="quiz-head"><span class="qtitle">◉ Quizeru</span><span class="qcount">${t.quizQuestionWord} ${qz.index+1} / ${total}</span></div>
    <div class="quiz-progress-track"><div class="quiz-progress-bar" style="width:${pct}%"></div></div>
    <div class="quiz-question">${q.q}</div>
    <div class="quiz-options">
      ${q.options.map((opt,i)=>{
        let cls="";
        if(qz.answered){
          if(i===q.correctIndex) cls="correct";
          else if(i===qz.selected) cls="wrong";
        }
        return `<button class="quiz-option ${cls}" data-action="answer" data-idx="${i}" ${qz.answered?'disabled':''}>
          <span class="opt-letter">${letters[i]}</span><span>${opt}</span>
        </button>`;
      }).join("")}
    </div>
    ${qz.answered && qz.selected!==q.correctIndex ? `
      <div class="ai-explain-panel">
        <div class="ai-head"><div class="ai-avatar">AI</div><h4>${t.quizWrongTitle}</h4></div>
        <p>${q.explain}${section ? " " + t.aiRefSuffix(section) : ""}</p>
      </div>` : ``}
    ${qz.answered ? `<div class="quiz-continue"><button class="btn btn-primary" data-action="quiz-continue">${t.quizContinue} ${ICONS.arrowRight}</button></div>` : ``}
  </div>`;
}
function renderQuizResult(){
  const t = ui();
  const qz = state.quiz;
  const total = qz.questions.length;
  const score = Math.round((qz.correct/total)*100);
  const cat = scoreCategory(score);
  const circumference = 2*Math.PI*60;
  const offset = circumference * (1 - score/100);
  return `<div class="quiz-page">
    <div class="quiz-result">
      <h2>${t.quizDone}</h2>
      <div class="score-ring">
        <svg viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="60" fill="none" stroke="#DEDACB" stroke-width="10"/>
          <circle cx="70" cy="70" r="60" fill="none" stroke="#5C7A4F" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="score-num">${score}%</div>
      </div>
      <div class="cat">${cat}</div>
      <div class="stats-row">
        <div><b>${qz.correct}</b><span>${t.quizCorrectWord}</span></div>
        <div><b>${qz.wrong}</b><span>${t.quizWrongWord}</span></div>
        <div><b>${qz.correct}/${total}</b><span>${t.quizScoreWord}</span></div>
      </div>
      <div class="result-ctas">
        <button class="btn btn-primary" data-action="quiz-retry">${t.quizRetry}</button>
        <button class="btn btn-ghost" data-nav="toc">${t.quizStudy}</button>
        <button class="btn btn-ghost" data-nav="home">${t.quizHome}</button>
      </div>
    </div>
  </div>`;
}

      ${rows.map(([l,v])=>`<div class="memory-row"><span class="m-label">${l}</span><span class="m-value">${v}</span></div>`).join("")}
    </div>
    <div class="hero-ctas">
      <button class="btn btn-ghost" data-nav="ai">${isId?'Kembali ke LaMa AI':'Back to LaMa AI'}</button>
      <button class="btn btn-danger" data-action="open-reset-confirm">${isId?'Reset Memory':'Reset Memory'}</button>
    </div>
  </div>`;
}

/* ---------- MODALS: disclaimer / reset confirm ---------- */
function renderDisclaimerModal(){
  if(state.disclaimerSeen || state.route.view!=="ai") return "";
  const t = ui();
  return `<div class="modal-overlay show">
    <div class="modal-box">
      <h3>${t.disclaimerTitle}</h3>
      <p>${t.disclaimerBody}</p>
      <button class="btn btn-primary" data-action="ack-disclaimer">${t.disclaimerOk}</button>
    </div>
  </div>`;
}
function renderResetConfirmModal(){
  if(!state.confirmResetOpen) return "";
  const isId = state.lang==='id';
  return `<div class="modal-overlay show">
    <div class="modal-box">
      <h3>${isId?'Hapus Memory?':'Delete Memory?'}</h3>
      <p>${isId?'Apakah kamu yakin ingin menghapus ingatan LaMa AI? Tindakan ini tidak dapat dibatalkan.':"Are you sure you want to erase LaMa AI's memory? This cannot be undone."}</p>
      <div class="hero-ctas">
        <button class="btn btn-ghost" data-action="cancel-reset">${isId?'Batal':'Cancel'}</button>
        <button class="btn btn-danger" data-action="confirm-reset">${isId?'Hapus Memory':'Delete Memory'}</button>
      </div>
    </div>
  </div>`;
}
function renderCelebrateToastHost(){ return `<div id="celebrate-host"></div>`; }
function showCelebrateToast(){
  const t = ui();
  const host = document.getElementById("celebrate-host");
  if(!host) return;
  const toast = document.createElement("div");
  toast.className = "celebrate-toast";
  toast.innerHTML = `${ICONS.check}<span>${t.quizCorrectToast}</span>`;
  host.appendChild(toast);
  requestAnimationFrame(()=>toast.classList.add("show"));
  if(!state.reducedMotion){
    for(let i=0;i<6;i++){
      const s = document.createElement("div");
      s.className="sparkle"; s.textContent="✦";
      const rect = document.querySelector(".topbar")?.getBoundingClientRect();
      const x = (rect ? rect.width/2 : window.innerWidth/2) + (Math.random()*80-40);
      s.style.left = x+"px"; s.style.top = "90px";
      s.style.setProperty("--sx",(Math.random()*60-30)+"px");
      s.style.setProperty("--sy",(-(30+Math.random()*30))+"px");
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),750);
    }
  }
  setTimeout(()=>{ toast.classList.remove("show"); setTimeout(()=>toast.remove(),300); }, 1600);
}

/* ============================================================
   <!-- UI --> EVENTS (delegation-friendly, reattached each render)
   ============================================================ */
function attachEvents(){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const view = el.getAttribute("data-nav");
      if(view==="section") goSection(parseInt(el.getAttribute("data-num"),10), "next", "browse");
      else if(view==="quiz"){ state.quiz.stage="mode"; state.quiz.mode=null; navigate({view:"quiz"}, "next"); }
      else navigate({view});
    });
  });

  document.querySelectorAll("[data-lang]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.lang = el.getAttribute("data-lang");
      persistSetting(LANG_KEY, state.lang);
      render();
    });
  });

  document.querySelectorAll("[data-theme-mode]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.themeMode = el.getAttribute("data-theme-mode");
      persistSetting(THEME_KEY, state.themeMode);
      applyTheme();
      render();
    });
  });

  document.querySelectorAll("[data-toggle]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const k = el.getAttribute("data-toggle");
      state.openCards[k] = !state.openCards[k];
      render();
    });
  });

  const drawerOpenBtn = document.querySelector('[data-action="open-drawer"]');
  if(drawerOpenBtn) drawerOpenBtn.addEventListener("click", ()=>{ state.drawerOpen=true; render(); const first=document.querySelector(".drawer .drawer-item"); if(first) first.focus(); });
  document.querySelectorAll('[data-action="close-drawer"]').forEach(el=>el.addEventListener("click", ()=>{ state.drawerOpen=false; render(); }));

  const searchOpenBtn = document.querySelector('[data-action="open-search"]');
  if(searchOpenBtn) searchOpenBtn.addEventListener("click", openSearch);
  const searchBackdrop = document.querySelector('[data-action="close-search-backdrop"]');
  if(searchBackdrop) searchBackdrop.addEventListener("click", (e)=>{ if(e.target===searchBackdrop) closeSearch(); });
  const clearBtn = document.querySelector('[data-action="clear-search"]');
  if(clearBtn) clearBtn.addEventListener("click", ()=>{ state.searchQuery=""; render(); focusSearchInput(); });
  const searchInput = document.getElementById("search-input");
  if(searchInput){ searchInput.addEventListener("input",(e)=>{ state.searchQuery=e.target.value; renderSearchOnly(); }); }
  if(state.searchOpen) focusSearchInput();

  const prevBtn = document.querySelector('[data-action="prev"]');
  if(prevBtn) prevBtn.addEventListener("click", ()=>{
    if(state.route.view!=="section") return;
    if(state.route.number>1) goSection(state.route.number-1, "prev", state.route.mode);
    else if(state.route.mode==="learn") navigate({view: state.learnBackTarget||"home"}, "prev");
  });
  const nextBtn = document.querySelector('[data-action="next"]');
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    const total = d().sections.length;
    if(state.route.view==="section"){
      if(state.route.number>=total){
        if(state.route.mode==="learn") navigate({view:"completion"}, "next");
        else navigate({view:"toc"}, "next");
      } else {
        goSection(state.route.number+1, "next", state.route.mode);
      }
    }
  });
  const startLearnBtn = document.querySelector('[data-action="start-learning"]');
  if(startLearnBtn) startLearnBtn.addEventListener("click", ()=>{
    state.learnBackTarget = "home";
    navigate({view:"section", number:1, mode:"learn"}, "next");
  });
  const completionBackBtn = document.querySelector('[data-action="completion-back"]');
  if(completionBackBtn) completionBackBtn.addEventListener("click", ()=>{ navigate({view: state.learnBackTarget||"home"}, "prev"); });
  const completionQuizBtn = document.querySelector('[data-action="completion-quiz"]');
  if(completionQuizBtn) completionQuizBtn.addEventListener("click", ()=>{ state.quiz.stage="mode"; state.quiz.mode=null; navigate({view:"quiz"}, "next"); });

  document.querySelectorAll('[data-action="select-mode"]').forEach(el=>{
    el.addEventListener("click", ()=>{ startQuiz(el.getAttribute("data-mode")); });
  });
  document.querySelectorAll('[data-action="answer"]').forEach(el=>{
    el.addEventListener("click", ()=>{ answerQuizOption(parseInt(el.getAttribute("data-idx"),10)); });
  });
  const quizContinueBtn = document.querySelector('[data-action="quiz-continue"]');
  if(quizContinueBtn) quizContinueBtn.addEventListener("click", nextQuizQuestion);
  const quizRetryBtn = document.querySelector('[data-action="quiz-retry"]');
  if(quizRetryBtn) quizRetryBtn.addEventListener("click", ()=>{ state.quiz={stage:"mode",mode:null,questions:[],index:0,correct:0,wrong:0,answered:false,selected:null,wrongTopics:[]}; render(); });

  const sendBtn = document.querySelector('[data-action="send-ai"]');
  const aiInput = document.getElementById("ai-input");
  if(sendBtn && aiInput) sendBtn.addEventListener("click", ()=>{ const v=aiInput.value; aiInput.value=""; sendAiMessage(v); });
  if(aiInput){
    aiInput.addEventListener("keydown",(e)=>{
      if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); const v=aiInput.value; aiInput.value=""; sendAiMessage(v); }
    });
    aiInput.addEventListener("input", ()=>{ aiInput.style.height="auto"; aiInput.style.height=Math.min(aiInput.scrollHeight,120)+"px"; });
    aiInput.focus();
  }
  scrollAiToBottom();
  const clearChatBtn = document.querySelector('[data-action="clear-chat"]');
  if(clearChatBtn) clearChatBtn.addEventListener("click", ()=>{ state.ai.messages=[]; render(); });

  const ackBtn = document.querySelector('[data-action="ack-disclaimer"]');
  if(ackBtn) ackBtn.addEventListener("click", ()=>{ state.disclaimerSeen=true; persistSetting(DISCLAIMER_KEY,"1"); render(); });

  const soundToggle = document.querySelector('[data-action="toggle-sound"]');
  if(soundToggle) soundToggle.addEventListener("click", ()=>{ state.soundOn=!state.soundOn; persistSetting(SOUND_KEY, state.soundOn?"1":"0"); render(); });
  const hapticToggle = document.querySelector('[data-action="toggle-haptic"]');
  if(hapticToggle) hapticToggle.addEventListener("click", ()=>{ state.hapticOn=!state.hapticOn; persistSetting(HAPTIC_KEY, state.hapticOn?"1":"0"); render(); });
  const motionToggle = document.querySelector('[data-action="toggle-motion"]');
  if(motionToggle) motionToggle.addEventListener("click", ()=>{ state.reducedMotion=!state.reducedMotion; persistSetting(REDUCED_MOTION_KEY, state.reducedMotion?"1":"0"); render(); });

  const resetOpenBtn = document.querySelector('[data-action="open-reset-confirm"]');
  if(resetOpenBtn) resetOpenBtn.addEventListener("click", ()=>{ state.confirmResetOpen=true; render(); });
  const resetCancelBtn = document.querySelector('[data-action="cancel-reset"]');
  if(resetCancelBtn) resetCancelBtn.addEventListener("click", ()=>{ state.confirmResetOpen=false; render(); });
  const resetConfirmBtn = document.querySelector('[data-action="confirm-reset"]');
  if(resetConfirmBtn) resetConfirmBtn.addEventListener("click", ()=>{ resetMemory(); state.confirmResetOpen=false; render(); });
}

function renderSearchOnly(){
  const old = document.querySelector(".search-overlay");
  if(!old) return;
  const temp = document.createElement("div");
  temp.innerHTML = renderSearchOverlay();
  old.replaceWith(temp.firstElementChild);
  attachSearchOnlyEvents();
  focusSearchInput();
}
function attachSearchOnlyEvents(){
  document.querySelectorAll('.search-overlay [data-nav]').forEach(el=>{
    el.addEventListener("click", ()=>{ const view=el.getAttribute("data-nav"); if(view==="section") goSection(parseInt(el.getAttribute("data-num"),10), "next", "browse"); });
  });
  const searchBackdrop = document.querySelector('[data-action="close-search-backdrop"]');
  if(searchBackdrop) searchBackdrop.addEventListener("click", (e)=>{ if(e.target===searchBackdrop) closeSearch(); });
  const clearBtn = document.querySelector('[data-action="clear-search"]');
  if(clearBtn) clearBtn.addEventListener("click", ()=>{ state.searchQuery=""; renderSearchOnly(); });
  const input = document.getElementById("search-input");
  if(input) input.addEventListener("input",(e)=>{ state.searchQuery=e.target.value; renderSearchOnly(); });
}
function openSearch(){ state.searchOpen=true; render(); }
function closeSearch(){ state.searchOpen=false; state.searchQuery=""; render(); }
function focusSearchInput(){ const el=document.getElementById("search-input"); if(el){ el.focus(); const v=el.value; el.value=""; el.value=v; } }

/* ---------- KEYBOARD NAVIGATION ---------- */
document.addEventListener("keydown", (e)=>{
  const tag = (e.target.tagName||"").toLowerCase();
  const typing = tag==="input" || tag==="textarea";

  if(e.key==="Escape"){
    if(state.searchOpen){ closeSearch(); return; }
    if(state.confirmResetOpen){ state.confirmResetOpen=false; render(); return; }
    if(state.drawerOpen){ state.drawerOpen=false; render(); return; }
  }
  if(typing) return;

  if(e.key==="Home"){ e.preventDefault(); navigate({view:"home"}); return; }
  if(state.route.view==="section"){
    const total = d().sections.length;
    if(e.key==="ArrowRight"){
      e.preventDefault();
      if(state.route.number<total) goSection(state.route.number+1,"next", state.route.mode);
      else if(state.route.mode==="learn") navigate({view:"completion"},"next");
      else navigate({view:"toc"},"next");
    }
    if(e.key==="ArrowLeft"){
      e.preventDefault();
      if(state.route.number>1) goSection(state.route.number-1,"prev", state.route.mode);
      else if(state.route.mode==="learn") navigate({view: state.learnBackTarget||"home"}, "prev");
    }
  }
});

/* ============================================================
   INIT
   ============================================================ */
loadMemory();
applyReducedMotion();
render();
</script>
</body>
