<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratorium Maya — Ensiklopedia Interaktif & LaMa AI</title>
<style>
:root{
  --bg:#F5F3EC; --bg-deep:#EFEBE0; --surface:#FFFFFF; --line:#DEDACB; --line-soft:#E9E5D8;
  --ink:#1C2A2E; --ink-soft:#57646A; --ink-faint:#8A9298;
  --primary:#254D52; --primary-ink:#123034; --primary-soft:#E4ECEA;
  --secondary:#5C7A4F; --secondary-soft:#E9EFE3;
  --accent:#2E8B84; --accent-soft:#DCEFEE;
  --success:#3E8E5C; --success-soft:#E3F2E7;
  --error:#B4483F; --error-soft:#F7E4E1;
  --physical:#8C6A4E; --virtual:#2B6E63;
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --shadow:0 1px 2px rgba(28,42,46,.06), 0 6px 20px -8px rgba(28,42,46,.14);
  --dur-1:180ms; --dur-2:420ms; --ease:cubic-bezier(.32,.72,0,1);
  --topbar-bg:rgba(245,243,236,.94);
  --border-highlight:#D2E0C6; --border-highlight-2:#C9DAD8; --border-highlight-3:#E4C4BF; --border-highlight-3-hover:#F1D2CC;
  --overlay:rgba(18,48,52,.4);
}
/* THEME — dark mode overrides. Values chosen to preserve the same
   natural/scientific hue relationships as the light palette (§4). */
html[data-theme="dark"]{
  --bg:#101A1C; --bg-deep:#0B1315; --surface:#182225; --line:#2B3A3D; --line-soft:#222E31;
  --ink:#E8EFED; --ink-soft:#ACBABA; --ink-faint:#7E8D8D;
  --primary:#5FB3AA; --primary-ink:#EAF4F2; --primary-soft:#1E3436;
  --secondary:#8FC17A; --secondary-soft:#20301E;
  --accent:#4FCFC6; --accent-soft:#173634;
  --success:#68C48A; --success-soft:#173423;
  --error:#E38F87; --error-soft:#3B211D;
  --physical:#CBA179; --virtual:#63C2AE;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -8px rgba(0,0,0,.55);
  --topbar-bg:rgba(16,26,28,.88);
  --border-highlight:#2E4A3B; --border-highlight-2:#264240; --border-highlight-3:#4A2C27; --border-highlight-3-hover:#583530;
  --overlay:rgba(4,10,11,.6);
}
*{box-sizing:border-box;}
/* Smooth, non-jarring color transition whenever the theme changes (§5). */
*,*::before,*::after{ transition:background-color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease); }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ transition:none !important; } }
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; transition:background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);}
h1,h2,h3,h4{font-family:Georgia, 'Times New Roman', serif; font-weight:600; letter-spacing:-0.01em; color:var(--primary-ink); margin:0 0 .5em;}
p{margin:0 0 1em;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px;}
#app{min-height:100vh; display:flex; flex-direction:column;}

/* topbar */
.topbar{position:sticky; top:0; z-index:40; background:var(--topbar-bg); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); transition:background var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);}
.topbar-inner{max-width:1180px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:16px;}
.brand{display:flex; align-items:center; gap:10px; font-family:Georgia,serif; font-weight:600; font-size:1.02rem; color:var(--primary-ink); cursor:pointer; white-space:nowrap; background:none; border:none; padding:0;}
.brand-mark{width:24px; height:24px; flex-shrink:0;}
.brand-mark svg{width:100%; height:100%; display:block;}
.topnav{display:flex; align-items:center; gap:2px; flex:1; overflow-x:auto;}
.topnav-link{background:none; border:none; cursor:pointer; font-size:.9rem; color:var(--ink-soft); padding:8px 12px; border-radius:var(--radius-s); transition:background var(--dur-1) var(--ease), color var(--dur-1); white-space:nowrap;}
.topnav-link:hover{background:var(--primary-soft); color:var(--primary-ink);}
.topnav-link[aria-current="true"]{color:var(--primary-ink); font-weight:600; background:var(--primary-soft);}
.topbar-right{display:flex; align-items:center; gap:8px; margin-left:auto;}
.icon-btn{background:none; border:1px solid transparent; cursor:pointer; width:36px; height:36px; border-radius:var(--radius-s); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); transition:background var(--dur-1), border-color var(--dur-1); flex-shrink:0;}
.icon-btn:hover{background:var(--primary-soft); border-color:var(--line);}
.icon-btn svg{width:18px; height:18px;}
.lang-switch{display:flex; border:1px solid var(--line); border-radius:20px; overflow:hidden; font-size:.78rem; font-weight:600; font-family:monospace;}
.lang-switch button{background:var(--surface); border:none; padding:6px 11px; cursor:pointer; color:var(--ink-faint); transition:background var(--dur-1), color var(--dur-1);}
.lang-switch button.active{background:var(--primary); color:#fff;}
.theme-switch{font-family:inherit; font-size:.8rem;}
.theme-switch button{padding:7px 13px;}
.hamburger{display:none;}

main{flex:1; width:100%;}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px;}

/* HERO */
.hero{padding:72px 24px 56px; border-bottom:1px solid var(--line);}
.hero-grid{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:1.1fr .9fr; gap:52px; align-items:center;}
.hero-eyebrow{font-size:.8rem; color:var(--secondary); font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.hero-eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--secondary); display:inline-block;}
.hero h1{font-size:clamp(2.2rem,5vw,3.2rem); line-height:1.05; margin-bottom:16px;}
.hero .sub{font-size:1.08rem; color:var(--ink-soft); max-width:46ch; margin-bottom:14px; font-style:italic;}
.hero .desc{font-size:1rem; color:var(--ink-soft); max-width:54ch; margin-bottom:28px;}
.hero-ctas{display:flex; gap:14px; flex-wrap:wrap;}
.btn{display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:var(--radius-s); font-size:.94rem; font-weight:600; cursor:pointer; border:1px solid transparent; transition:transform var(--dur-1) var(--ease), background var(--dur-1);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-ink);}
.btn-ghost{background:transparent; color:var(--primary-ink); border-color:var(--line);}
.btn-ghost:hover{background:var(--primary-soft);}
.hero-visual{position:relative; aspect-ratio:1/1; max-width:400px; justify-self:center;}
.hero-visual svg{width:100%; height:100%;}
.hero-stats{max-width:1180px; margin:48px auto 0; display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden;}
.stat{background:var(--surface); padding:18px 20px;}
.stat b{display:block; font-family:Georgia,serif; font-size:1.5rem; color:var(--primary-ink);}
.stat span{font-size:.8rem; color:var(--ink-faint);}

/* TOC */
.toc-section{padding:52px 24px 76px;}
.section-head{max-width:640px; margin-bottom:32px;}
.section-head .kicker{font-size:.8rem; color:var(--secondary); font-weight:600; margin-bottom:10px;}
.section-head h2{font-size:1.9rem;}
.section-head p{color:var(--ink-soft);}
.toc-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
.toc-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:22px 22px; cursor:pointer; text-align:left; transition:border-color var(--dur-1), box-shadow var(--dur-1); position:relative;}
.toc-card:hover{border-color:var(--secondary); box-shadow:var(--shadow);}
.toc-card .num{font-family:Georgia,serif; font-size:1.3rem; color:var(--secondary); font-weight:600; margin-bottom:10px;}
.toc-card h3{font-size:1.02rem; margin-bottom:6px;}
.toc-card p{font-size:.87rem; color:var(--ink-soft); margin:0;}
.toc-card .badge{position:absolute; top:18px; right:18px; font-size:.68rem; color:var(--secondary); background:var(--secondary-soft); padding:3px 8px; border-radius:20px; font-weight:600;}
.toc-card .toc-status{position:absolute; top:18px; left:18px; width:20px; height:20px; border-radius:50%; background:var(--success-soft); color:var(--success); display:flex; align-items:center; justify-content:center;}
.toc-card .toc-status svg{width:12px; height:12px;}

/* SECTION PAGE */
.section-page{padding:40px 24px 40px; min-height:60vh;}
.section-layout{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:220px 1fr; gap:44px;}
.mini-toc{position:sticky; top:76px; align-self:start;}
.mini-toc-title{font-size:.74rem; color:var(--ink-faint); font-weight:600; margin-bottom:10px;}
.mini-toc-list{display:flex; flex-direction:column; gap:2px;}
.mini-toc-list button{text-align:left; background:none; border:none; cursor:pointer; padding:8px 10px; border-radius:var(--radius-s); font-size:.85rem; color:var(--ink-faint); display:flex; gap:10px; align-items:baseline; transition:background var(--dur-1), color var(--dur-1);}
.mini-toc-list button:hover{background:var(--primary-soft); color:var(--ink);}
.mini-toc-list button[aria-current="true"]{color:var(--primary-ink); font-weight:600; background:var(--primary-soft);}
.mini-toc-list span.n{font-family:monospace; font-size:.7rem; color:var(--ink-faint); width:16px; flex-shrink:0;}
.section-content{min-width:0;}
.section-eyebrow{display:flex; align-items:center; gap:10px; font-size:.8rem; color:var(--secondary); font-weight:600; margin-bottom:14px;}
.section-content h2{font-size:2rem; margin-bottom:20px;}
.content-fade{animation:fadeUp var(--dur-2) var(--ease);}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* ---------- VERTICAL PAGE TRANSITION (§7) ----------
   Directional bottom-to-top motion between sections/pages, powered by the
   View Transitions API where supported. Falls back silently (instant swap +
   the .content-fade above) on browsers without support, and is fully
   disabled under reduced motion. */
@media (prefers-reduced-motion: no-preference){
  ::view-transition-old(root),
  ::view-transition-new(root){ animation-duration:520ms; animation-timing-function:cubic-bezier(0.22,1,0.36,1); animation-fill-mode:both; }
  html[data-transition-dir="next"]::view-transition-old(root){ animation-name:lm-out-up; }
  html[data-transition-dir="next"]::view-transition-new(root){ animation-name:lm-in-up; }
  html[data-transition-dir="prev"]::view-transition-old(root){ animation-name:lm-out-down; }
  html[data-transition-dir="prev"]::view-transition-new(root){ animation-name:lm-in-down; }
}
@keyframes lm-out-up{ from{ transform:translateY(0); opacity:1; } to{ transform:translateY(-20px); opacity:0; } }
@keyframes lm-in-up{ from{ transform:translateY(20px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
@keyframes lm-out-down{ from{ transform:translateY(0); opacity:1; } to{ transform:translateY(20px); opacity:0; } }
@keyframes lm-in-down{ from{ transform:translateY(-20px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
@media (prefers-reduced-motion: reduce){
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*){ animation:none !important; }
}
.block{margin-bottom:28px;}
.block p{color:var(--ink-soft); max-width:70ch;}
.block ul{margin:0 0 1em; padding-left:20px; color:var(--ink-soft); max-width:66ch;}
.block li{margin-bottom:6px;}
.highlight-box{background:var(--secondary-soft); border:1px solid var(--border-highlight); border-radius:var(--radius-m); padding:24px 26px; margin:8px 0 28px;}
.highlight-box .tag{font-size:.76rem; font-weight:700; color:var(--secondary); margin-bottom:8px; display:block;}
.highlight-box h3{font-size:1.24rem; margin-bottom:8px;}
.highlight-box p{margin:0; color:var(--ink-soft);}

.card-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.flip-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:20px 18px; cursor:pointer; transition:border-color var(--dur-1), box-shadow var(--dur-1);}
.flip-card:hover, .flip-card.open{border-color:var(--secondary); box-shadow:var(--shadow);}
.flip-card .letter{width:32px; height:32px; border-radius:8px; background:var(--primary-soft); color:var(--primary-ink); display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; font-weight:600; margin-bottom:12px;}
.flip-card h4{font-size:1rem; margin-bottom:4px;}
.flip-card .who{font-size:.78rem; color:var(--ink-faint); margin-bottom:10px;}
.flip-card .body{font-size:.87rem; color:var(--ink-soft); max-height:0; overflow:hidden; transition:max-height var(--dur-2) var(--ease);}
.flip-card.open .body{max-height:400px;}
.flip-card .toggle-hint{font-size:.74rem; color:var(--accent); font-weight:600; margin-top:8px; display:inline-block;}

.flow{display:flex; flex-direction:column; gap:0; max-width:520px; margin:8px 0 10px;}
.flow-step{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-s); padding:15px 17px; cursor:pointer; transition:border-color var(--dur-1), background var(--dur-1);}
.flow-step:hover, .flow-step.open{border-color:var(--primary); background:var(--primary-soft);}
.flow-step .fs-top{display:flex; align-items:center; gap:12px;}
.flow-step .fs-idx{width:24px; height:24px; border-radius:50%; background:var(--primary); color:#fff; font-size:.76rem; display:flex; align-items:center; justify-content:center; font-weight:600; flex-shrink:0;}
.flow-step h4{font-size:.94rem; margin:0;}
.flow-step .fs-desc{font-size:.84rem; color:var(--ink-soft); max-height:0; overflow:hidden; transition:max-height var(--dur-2) var(--ease); padding-left:36px;}
.flow-step.open .fs-desc{max-height:200px; margin-top:8px;}
.flow-connector{width:2px; height:18px; background:var(--line); margin-left:29px;}

.compare-wrap{border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; background:var(--surface);}
table.compare{width:100%; border-collapse:collapse; font-size:.89rem;}
table.compare thead th{background:var(--bg-deep); text-align:left; padding:13px 17px; font-family:Georgia,serif; font-weight:600; color:var(--primary-ink); border-bottom:1px solid var(--line);}
table.compare th:first-child, table.compare td:first-child{width:22%; color:var(--ink-soft); font-weight:600; font-size:.84rem;}
table.compare td{padding:13px 17px; border-bottom:1px solid var(--line-soft); vertical-align:top; color:var(--ink-soft);}
table.compare tbody tr:last-child td{border-bottom:none;}
table.compare td.physical{border-left:3px solid var(--physical);}
table.compare td.virtual{border-left:3px solid var(--virtual);}
.compare-cards{display:none;}
.compare-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:17px 19px; margin-bottom:13px;}
.compare-card h4{font-size:.94rem; margin-bottom:11px; color:var(--primary-ink);}
.compare-row{padding:9px 0; border-top:1px solid var(--line-soft);}
.compare-row:first-of-type{border-top:none;}
.compare-row .lbl{font-size:.71rem; font-weight:700; color:var(--ink-faint); margin-bottom:3px; display:flex; align-items:center; gap:6px;}
.compare-row .lbl.physical::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--physical);}
.compare-row .lbl.virtual::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--virtual);}
.compare-row .val{font-size:.86rem; color:var(--ink-soft);}

.taxo-list{display:flex; flex-direction:column; gap:13px;}
.taxo-item{display:grid; grid-template-columns:60px 1fr; gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:19px 21px;}
.taxo-vis{display:flex; align-items:center; justify-content:center;}
.taxo-vis svg{width:48px; height:48px;}
.taxo-item h4{font-size:1rem; margin-bottom:6px;}
.taxo-item p{font-size:.87rem; color:var(--ink-soft); margin-bottom:10px;}
.taxo-meta{display:flex; flex-wrap:wrap; gap:8px;}
.taxo-tag{font-size:.73rem; background:var(--bg-deep); color:var(--ink-soft); padding:4px 10px; border-radius:20px; border:1px solid var(--line);}

.disc-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
.disc-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:19px 21px;}
.disc-card .icon{width:28px; height:28px; margin-bottom:11px; color:var(--secondary);}
.disc-card .icon svg{width:100%; height:100%;}
.disc-card h4{font-size:.98rem; margin-bottom:8px;}
.disc-card ul{margin:0; padding-left:18px; font-size:.86rem;}

.plat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
.plat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:19px 21px;}
.plat-card h4{font-size:1rem; margin-bottom:2px;}
.plat-card .focus{font-size:.78rem; color:var(--accent); font-weight:600; margin-bottom:9px;}
.plat-card p{font-size:.86rem; color:var(--ink-soft); margin-bottom:8px;}
.plat-card .who{font-size:.77rem; color:var(--ink-faint); border-top:1px solid var(--line-soft); padding-top:8px; margin-top:9px;}

.cflow{display:flex; flex-direction:column; gap:2px; margin:20px 0 12px;}
.cflow-row{display:grid; grid-template-columns:1fr auto 1fr auto 1fr; align-items:stretch; gap:0 10px;}
.cflow-node{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-s); padding:14px 12px; font-size:.83rem; text-align:center; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-weight:600; min-height:62px; line-height:1.3;}
.cflow-node.emph{background:var(--primary); color:#fff; border-color:var(--primary);}
.cflow-arrow{display:flex; align-items:center; justify-content:center; color:var(--ink-faint); flex-shrink:0;}
.cflow-arrow svg{width:17px; height:17px;}
.cflow-connector{display:flex; justify-content:center; align-items:center; color:var(--ink-faint); padding:2px 0;}
.cflow-connector svg{width:17px; height:17px; transform:rotate(90deg);}

/* FOOTER NAV (section pages) */
.footer-nav{position:sticky; bottom:0; z-index:30; background:rgba(245,243,236,.95); backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:13px 24px;}
.footer-nav-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:18px;}
.fn-btn{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); padding:10px 16px; border-radius:var(--radius-s); cursor:pointer; font-size:.87rem; font-weight:600; color:var(--ink); transition:background var(--dur-1), border-color var(--dur-1);}
.fn-btn:hover:not(:disabled){border-color:var(--primary); background:var(--primary-soft);}
.fn-btn:disabled{opacity:.35; cursor:not-allowed;}
.fn-btn.next{margin-left:auto;}
.fn-progress{flex:1; max-width:260px; display:flex; flex-direction:column; gap:5px; align-items:center;}
.fn-progress-track{width:100%; height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
.fn-progress-bar{height:100%; background:var(--secondary); border-radius:2px; transition:width var(--dur-2) var(--ease);}
.fn-progress-label{font-size:.72rem; color:var(--ink-faint); font-family:monospace;}

footer.site-footer{border-top:1px solid var(--line); padding:34px 24px; margin-top:auto;}
.site-footer-inner{max-width:1180px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;}
.site-footer p{margin:0; font-size:.84rem; color:var(--ink-faint);}
.site-footer .credit{font-size:.8rem; color:var(--ink-faint);}
.site-footer .credit b{color:var(--ink-soft);}

/* SEARCH */
.search-overlay{position:fixed; inset:0; background:var(--overlay); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:10vh 20px; opacity:0; pointer-events:none; transition:opacity var(--dur-2) var(--ease);}
.search-overlay.show{opacity:1; pointer-events:auto;}
.search-panel{background:var(--surface); border-radius:var(--radius-m); width:100%; max-width:600px; box-shadow:0 20px 60px -10px rgba(0,0,0,.3); overflow:hidden; transform:translateY(-14px); transition:transform var(--dur-2) var(--ease); max-height:70vh; display:flex; flex-direction:column;}
.search-overlay.show .search-panel{transform:translateY(0);}
.search-input-row{display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line);}
.search-input-row svg{width:18px; height:18px; color:var(--ink-faint); flex-shrink:0;}
.search-input-row input{border:none; outline:none; flex:1; font-size:1.02rem; font-family:inherit; background:none; color:var(--ink);}
.search-clear{background:none; border:none; cursor:pointer; color:var(--ink-faint); padding:4px; display:none;}
.search-clear.show{display:flex;}
.search-results{overflow-y:auto; padding:8px;}
.search-result{display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer; padding:12px 14px; border-radius:var(--radius-s); transition:background var(--dur-1);}
.search-result:hover{background:var(--primary-soft);}

.quiz-intro .icon-big{width:56px; height:56px; margin:0 auto 18px; color:var(--secondary);}

.quiz-head .qtitle{font-size:.85rem; font-weight:700; color:var(--secondary);}
.quiz-head .qcount{font-size:.82rem; color:var(--ink-faint); font-family:monospace;}

.quiz-question{font-size:1.32rem; margin-bottom:22px; line-height:1.4;}
.quiz-options{display:flex; flex-direction:column; gap:10px;}
.quiz-option{display:flex; align-items:center; gap:14px; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-m); padding:15px 18px; cursor:pointer; text-align:left; font-size:.96rem; color:var(--ink); transition:border-color var(--dur-1), background var(--dur-1), transform var(--dur-1);}

.quiz-option .opt-letter{width:28px; height:28px; border-radius:50%; background:var(--bg-deep); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.82rem; color:var(--ink-soft); flex-shrink:0;}
.quiz-option.correct{border-color:var(--success); background:var(--success-soft);}
.quiz-option.correct .opt-letter{background:var(--success); color:#fff;}
.quiz-option.wrong{border-color:var(--error); background:var(--error-soft);}
.quiz-option.wrong .opt-letter{background:var(--error); color:#fff;}
.quiz-option:disabled{cursor:default;}
.quiz-continue{margin-top:24px; display:flex; justify-content:flex-end;}

.ai-explain-panel{margin-top:20px; background:var(--primary-soft); border:1px solid var(--border-highlight-2); border-radius:var(--radius-m); padding:20px 22px; animation:fadeUp var(--dur-2) var(--ease);}
.ai-explain-panel .ai-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.ai-explain-panel .ai-avatar{width:28px; height:28px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700; flex-shrink:0;}
.ai-explain-panel h4{font-size:.98rem; margin:0;}
.ai-explain-panel p{font-size:.9rem; color:var(--ink-soft); margin:0;}

.celebrate-toast{position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-10px); background:var(--success); color:#fff; padding:12px 22px; border-radius:30px; font-size:.92rem; font-weight:600; display:flex; align-items:center; gap:10px; box-shadow:0 10px 30px -8px rgba(0,0,0,.3); z-index:120; opacity:0; pointer-events:none; transition:opacity var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);}
.celebrate-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.celebrate-toast svg{width:18px; height:18px;}
.sparkle{position:fixed; z-index:119; pointer-events:none; font-size:14px; animation:sparklePop 700ms ease-out forwards;}
@keyframes sparklePop{0%{opacity:1; transform:translate(0,0) scale(.6);} 100%{opacity:0; transform:translate(var(--sx),var(--sy)) scale(1.2);}}

.quiz-result{text-align:center; padding:30px 10px;}
.quiz-result .score-ring{width:140px; height:140px; margin:0 auto 20px; position:relative; display:flex; align-items:center; justify-content:center;}
.quiz-result .score-ring svg{width:100%; height:100%; transform:rotate(-90deg);}
.quiz-result .score-num{position:absolute; font-family:Georgia,serif; font-size:1.8rem; color:var(--primary-ink);}
.quiz-result h2{font-size:1.5rem; margin-bottom:6px;}
.quiz-result .cat{font-size:1rem; color:var(--secondary); font-weight:700; margin-bottom:20px;}
.quiz-result .stats-row{display:flex; justify-content:center; gap:26px; margin-bottom:28px;}
.quiz-result .stats-row div{text-align:center;}
.quiz-result .stats-row b{display:block; font-size:1.3rem; font-family:Georgia,serif;}
.quiz-result .stats-row span{font-size:.78rem; color:var(--ink-faint);}
.result-ctas{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}

/* AI CHAT */
.ai-page{max-width:760px; margin:0 auto; padding:28px 24px 0; display:flex; flex-direction:column; height:calc(100vh - 64px);}
.ai-chat-head{display:flex; align-items:center; justify-content:space-between; padding-bottom:16px; border-bottom:1px solid var(--line);}
.ai-chat-head-left{display:flex; align-items:center; gap:12px;}
.ai-chat-head .ai-avatar-lg{width:38px; height:38px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.9rem; flex-shrink:0;}
.ai-chat-head h3{font-size:1.05rem; margin:0;}
.ai-chat-head .sub{font-size:.78rem; color:var(--ink-faint);}
.ai-chat-head-right{display:flex; align-items:center; gap:6px;}
.ai-messages{flex:1; overflow-y:auto; padding:18px 4px; display:flex; flex-direction:column; gap:14px;}
.ai-msg{max-width:78%; padding:12px 16px; border-radius:var(--radius-m); font-size:.92rem; line-height:1.5; animation:fadeUp var(--dur-1) var(--ease);}
.ai-msg.user{align-self:flex-end; background:var(--primary); color:#fff; border-bottom-right-radius:3px;}
.ai-msg.ai{align-self:flex-start; background:var(--surface); border:1px solid var(--line); color:var(--ink); border-bottom-left-radius:3px;}
.ai-msg .msg-src{display:block; font-size:.72rem; color:var(--accent); margin-top:8px; font-weight:600;}
.ai-typing{align-self:flex-start; display:flex; gap:4px; padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); border-bottom-left-radius:3px;}
.ai-typing span{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); animation:typingBounce 1.1s infinite ease-in-out;}
.ai-typing span:nth-child(2){animation-delay:.15s;}
.ai-typing span:nth-child(3){animation-delay:.3s;}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-5px); opacity:1;}}
.ai-input-row{display:flex; gap:10px; padding:16px 4px 20px; border-top:1px solid var(--line); align-items:flex-end;}
.ai-input-row textarea{flex:1; resize:none; border:1.5px solid var(--line); border-radius:var(--radius-m); padding:12px 14px; font-family:inherit; font-size:.92rem; max-height:120px; outline:none; transition:border-color var(--dur-1);}
.ai-input-row textarea:focus{border-color:var(--primary);}
.ai-send-btn{background:var(--primary); color:#fff; border:none; border-radius:var(--radius-m); width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:background var(--dur-1);}
.ai-send-btn:hover{background:var(--primary-ink);}
.ai-send-btn svg{width:18px; height:18px;}

/* MODAL (disclaimer) */
.modal-overlay{position:fixed; inset:0; background:var(--overlay); z-index:150; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity var(--dur-2) var(--ease);}
.modal-overlay.show{opacity:1; pointer-events:auto;}
.modal-box{background:var(--surface); border-radius:var(--radius-l); max-width:440px; width:100%; padding:28px 26px; box-shadow:0 24px 70px -10px rgba(0,0,0,.35); transform:translateY(10px); transition:transform var(--dur-2) var(--ease);}
.modal-overlay.show .modal-box{transform:translateY(0);}
.modal-box h3{font-size:1.2rem; margin-bottom:12px;}
.modal-box p{font-size:.9rem; color:var(--ink-soft); margin-bottom:14px;}
.modal-box .btn{width:100%; justify-content:center;}

@media (max-width:920px){
  .card-grid{grid-template-columns:1fr 1fr;}
  .disc-grid, .plat-grid, .toc-grid{grid-template-columns:1fr;}
  .section-layout{grid-template-columns:1fr;}
  .mini-toc{display:none;}
  .hero-grid{grid-template-columns:1fr; text-align:left;}
  .hero-visual{max-width:260px; margin-top:16px;}
  .hero-stats{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:680px){
  .card-grid{grid-template-columns:1fr;}
  table.compare{display:none;}
  .compare-cards{display:block;}
  .topnav{display:none;}
  .hamburger{display:flex;}
  .topbar-inner{padding:12px 16px;}
  .wrap, .toc-section, .section-page, .hero, .quiz-page, .ai-page{padding-left:16px; padding-right:16px;}

  .fn-btn span.txt{display:none;}
  .fn-progress{max-width:none;}
  .cflow-row{grid-template-columns:1fr;}
  .cflow-row .cflow-arrow{transform:rotate(90deg); margin:2px 0;}
  .ai-msg{max-width:88%;}
}
.mobile-menu{position:fixed; inset:0 0 0 auto; width:82%; max-width:300px; background:var(--surface); z-index:90; transform:translateX(100%); transition:transform var(--dur-2) var(--ease); box-shadow:-10px 0 40px rgba(0,0,0,.15); padding:20px; display:flex; flex-direction:column; gap:4px;}
.mobile-menu.open{transform:translateX(0);}
.mobile-menu button{text-align:left; background:none; border:none; padding:14px 10px; font-size:1rem; cursor:pointer; color:var(--ink); border-bottom:1px solid var(--line-soft);}
.mobile-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:85; opacity:0; pointer-events:none; transition:opacity var(--dur-2);}
.mobile-backdrop.show{opacity:1; pointer-events:auto;}

/* ---------- DRAWER (primary navigation) ---------- */
.hamburger{display:flex;}
.drawer{position:fixed; inset:0 auto 0 0; width:88%; max-width:320px; background:var(--surface); z-index:110; transform:translateX(-100%); transition:transform var(--dur-2) var(--ease); box-shadow:10px 0 40px rgba(0,0,0,.18); padding:20px 14px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;}
.drawer.open{transform:translateX(0);}
@media (min-width:680px){ .drawer{width:320px;} }
.drawer-head{display:flex; align-items:center; justify-content:space-between; padding:6px 10px 18px;}
.drawer-brand{display:flex; align-items:center; gap:10px; font-weight:600; color:var(--primary-ink);}

.drawer-item{display:flex; align-items:center; gap:14px; text-align:left; background:none; border:none; padding:14px 12px; font-size:1rem; cursor:pointer; color:var(--ink); border-radius:var(--radius-s); transition:background var(--dur-1);}
.drawer-item:hover{background:var(--primary-soft);}
.drawer-item .glyph{font-size:1.15rem; width:22px; text-align:center; color:var(--secondary); flex-shrink:0;}
.drawer-divider{height:1px; background:var(--line); margin:10px 4px;}
.drawer-backdrop{position:fixed; inset:0; background:var(--overlay); z-index:105; opacity:0; pointer-events:none; transition:opacity var(--dur-2) var(--ease);}
.drawer-backdrop.show{opacity:1; pointer-events:auto;}

/* ---------- QUIZERU MODE SELECT ---------- */
.mode-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:26px;}
.mode-card{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-m); padding:22px 16px; text-align:center; cursor:pointer; transition:border-color var(--dur-1), box-shadow var(--dur-1), transform var(--dur-1);}
.mode-card:hover{border-color:var(--secondary); box-shadow:var(--shadow); transform:translateY(-2px);}
.mode-card .mode-name{font-family:Georgia,serif; font-size:1.1rem; margin-bottom:6px; color:var(--primary-ink);}
.mode-card .mode-count{font-size:.82rem; color:var(--ink-faint);}

.quiz-setup-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:22px 24px; margin-top:20px;}

.quiz-setup-row:last-child{border-bottom:none;}
.quiz-setup-row span:first-child{color:var(--ink-faint);}
.quiz-setup-row span:last-child{font-weight:600; color:var(--ink);}
.quiz-loading{display:flex; align-items:center; gap:12px; color:var(--ink-soft); font-size:.9rem; justify-content:center; padding:30px 0;}

.panel-page{max-width:640px; margin:0 auto; padding:40px 24px 60px;}

.settings-block{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:8px 20px; margin-bottom:20px;}
.settings-row{display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--line-soft);}
.settings-row:last-child{border-bottom:none;}
.settings-row .s-label{font-size:.94rem; font-weight:600;}
.settings-row .s-sub{font-size:.78rem; color:var(--ink-faint); margin-top:2px;}
.toggle-switch{width:44px; height:26px; border-radius:20px; background:var(--line); position:relative; cursor:pointer; border:none; flex-shrink:0; transition:background var(--dur-1);}
.toggle-switch.on{background:var(--primary);}
.toggle-switch .knob{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform var(--dur-1) var(--ease); box-shadow:0 1px 3px rgba(0,0,0,.3);}
.toggle-switch.on .knob{transform:translateX(18px);}
.btn-danger{background:var(--error-soft); color:var(--error); border:1px solid var(--border-highlight-3);}
.btn-danger:hover{background:var(--border-highlight-3-hover);}

          {letter:"B", title:"Teori Beban Kognitif", who:"Cognitive Load Theory — John Sweller", text:"Dalam laboratorium fisik konvensional, kapasitas memori kerja (working memory) siswa sering kali mengalami beban berlebih (cognitive overload) akibat kerumitan manual: cara memegang pipet yang benar, kekhawatiran memecahkan alat gelas mahal, atau ketakutan terhadap bahan beracun. Lab maya meminimalkan 'extraneous cognitive load' (beban kognitif tak relevan) tersebut sehingga alokasi memori kerja siswa dapat difokuskan sepenuhnya pada 'germane cognitive load' (pemahaman konsep sains inti)."},
          {letter:"C", title:"Teori Dual Coding", who:"Allan Paivio", text:"Otak manusia memproses informasi melalui dua saluran terpisah: verbal/teks dan visual/spasial. Laboratorium maya menggabungkan kedua saluran ini secara serentak — menampilkan teks rumus dan angka bersamaan dengan grafik real-time serta animasi reaksi fisik/kimia — yang secara signifikan meningkatkan retensi daya ingat jangka panjang."}
        ]},
        {type:"flow", compact:true, steps:[
          {label:"Teori Pembelajaran", desc:"Konstruktivisme, Beban Kognitif, dan Dual Coding sebagai dasar rancangan."},
          {label:"Aktivitas Pengguna", desc:"Hipotesis, manipulasi parameter, membaca teks & visual sekaligus."},
          {label:"Hasil Pembelajaran", desc:"Pemahaman konsep yang lebih dalam dan retensi ingatan jangka panjang."}
        ]}
      ]},
    { id:"arsitektur", number:3, title:"Arsitektur Komponen & Alur Kerja Simulasi", tagline:"Empat komponen fungsional yang bekerja terintegrasi dalam setiap simulasi.",
      blocks:[
        {type:"p", text:"Setiap aplikasi laboratorium maya yang efektif terdiri dari empat komponen fungsional yang bekerja secara terintegrasi. Ketuk setiap tahap untuk melihat penjelasannya."},
        {type:"flow", steps:[
          {label:"Input Layer (Variabel Bebas)", desc:"Antarmuka bagi pengguna untuk memasukkan parameter uji, seperti menggeser slider suhu, memilih jenis larutan, mengatur panjang tali pendulum, atau mengubah hambatan listrik."},
          {label:"Computational Engine (Model Matematika & Fisika)", desc:"Otak dari simulasi yang memproses algoritma ilmiah. Mesin ini menghitung data sesuai rumus mutlak dunia nyata (seperti Hukum Ohm, Persamaan Gas Ideal, atau Hukum Gravitasi Newton)."},
          {label:"Output Layer (Representasi Visual & Data)", desc:"Hasil kalkulasi diterjemahkan menjadi visualisasi dinamis (perubahan warna, percikan api, gerakan gelombang) dan grafik atau tabel data yang terus diperbarui secara real-time."},
          {label:"Feedback System (Umpan Balik & Evaluasi)", desc:"Sistem petunjuk pintar yang memberikan peringatan jika pengguna melakukan prosedur yang salah atau memberikan pertanyaan reflektif untuk menguji pemahaman."},
          {label:"User", desc:"Pengguna menerima umpan balik, menyesuaikan variabel di Input Layer, dan siklus simulasi berlanjut."}
        ]}
      ]},
    { id:"komparasi", number:4, title:"Komparasi Komprehensif: Lab Maya vs. Lab Fisik", tagline:"Perbandingan menyeluruh berdasarkan tujuh indikator utama.",
      blocks:[
        {type:"p", text:"Tabel berikut membandingkan Laboratorium Fisik (konvensional) dengan Laboratorium Maya (virtual) berdasarkan tujuh indikator."},
        {type:"compare", rows:[
          {label:"Keamanan (Safety)", physical:"Berisiko (paparan bahan kimia beracun, ledakan, sengatan listrik).", virtual:"100% Aman. Tidak ada risiko cidera fisik atau bahaya keselamatan."},
          {label:"Biaya Operasional", physical:"Sangat Mahal (bahan habis pakai, perawatan alat presisi, fasilitas gedung).", virtual:"Sangat Efisien (bebas biaya bahan kimia habis pakai dan alat pecah)."},
          {label:"Aksesibilitas Waktu", physical:"Terbatas pada jam operasional sekolah/kampus dan ketersediaan ruang.", virtual:"24/7 Tanpa Batas. Dapat diakses dari mana saja dan kapan saja via internet."},
          {label:"Keterampilan Motorik", physical:"Sangat Baik. Melatih koordinasi tangan, rasa taktil, dan teknik alat nyata.", virtual:"Tidak Ada. Hanya melatih interaksi digital (klik, drag, dan sentuhan layar)."},
          {label:"Kecepatan Iterasi", physical:"Lambat. Mengulang eksperimen memakan waktu persiapan ulang yang lama.", virtual:"Sangat Cepat. Eksperimen dapat di-reset dalam hitungan milidetik."},
          {label:"Visualisasi Mikroskopis", physical:"Terbatas pada batas kemampuan optik alat fisik dasar.", virtual:"Sangat Luas. Mampu memperbesar hingga skala atomik, molekuler, dan elektron."},
          {label:"Eksplorasi Ekstrem", physical:"Mustahil/Sangat Sukar (misal: simulasi gravitasi di Planet Mars).", virtual:"Sangat Mudah. Parameter lingkungan dapat diubah sesuai kondisi ekstrem."}
        ]}
      ]},
    { id:"taksonomi", number:5, title:"Taksonomi & Klasifikasi Laboratorium Maya", tagline:"Tiga kategori utama berdasarkan teknologi dan tingkat interaktivitas.",
      blocks:[
        {type:"p", text:"Laboratorium maya dapat diklasifikasikan ke dalam tiga kategori besar berikut."},
        {type:"taxonomy", items:[
          {letter:"A", title:"Simulasi 2D Interaktif", desc:"Berbasis grafis dua dimensi yang berfokus pada kecepatan muat dan kejelasan matematis. Pengguna berinteraksi dengan elemen-elemen grafis sederhana seperti slider, checkbox, dan tombol.", tags:["Slider & checkbox","Muat cepat","Konsep dasar fisika & matematika"]},
          {letter:"B", title:"Simulasi 3D & Virtual Reality (VR)", desc:"Menggunakan pemodelan tiga dimensi tingkat tinggi atau perangkat keras VR (seperti Oculus/Meta Quest). Jenis ini menciptakan rasa 'immersion' di mana pengguna merasa berada di laboratorium fisik nyata dan berinteraksi dengan alat 3D secara spasial.", tags:["Perangkat VR (Oculus/Meta Quest)","Interaksi spasial","Rasa immersion tinggi"]},
          {letter:"C", title:"Remote Laboratory", desc:"Menggabungkan dunia fisik dan digital. Alat laboratorium sebenarnya ditempatkan di sebuah lokasi fisik (misal: ruang lab universitas), lalu siswa mengendalikannya dari rumah melalui jaringan internet dan memantau pergerakan alat menggunakan kamera live streaming.", tags:["Alat fisik sungguhan","Kendali via internet","Kamera live streaming"]}
        ]}
      ]},
    { id:"penerapan", number:6, title:"Penerapan Mendalam Lintas Disiplin Ilmu", tagline:"Empat bidang ilmu utama yang memanfaatkan laboratorium maya.",
      blocks:[
        {type:"disciplines", items:[
          {title:"Kimia (Virtual Chemistry Lab)", items:["Titrasi","Kesetimbangan kimia","Laju reaksi","Termokimia — visualisasi tingkat molekuler saat ikatan kimia putus dan membentuk zat baru"]},
          {title:"Fisika (Virtual Physics Lab)", items:["Mekanika klasik","Optik gelombang","Kelistrikan & magnet","Fisika kuantum — manipulasi konstanta alam seperti gesekan udara atau percepatan gravitasi"]},
          {title:"Biologi & Kedokteran", items:["Diseksi hewan virtual (tanpa etika membunuh spesimen)","Genetika — persilangan DNA cepat","Pemetaan anatomi manusia interaktif 3D"]},
          {title:"Teknik & Rekayasa (Engineering)", items:["Pengujian ketahanan struktur bangunan","Simulasi sirkuit elektronik kompleks","Pengujian beban robotika"]}
        ]}
      ]},
    { id:"platform", number:7, title:"Platform Laboratorium Maya Terkemuka", tagline:"Empat platform laboratorium maya yang banyak digunakan.",
      blocks:[
        {type:"platforms", items:[
          {name:"PhET Interactive Simulations", focus:"Simulasi eksploratif gratis", desc:"Dikembangkan oleh University of Colorado Boulder. Gratis, open-source, dan berfokus pada simulasi eksploratif tanpa batasan aturan kuis.", who:"Cocok untuk eksplorasi bebas tanpa struktur kuis"},
          {name:"Labster", focus:"Simulasi 3D bernarasi", desc:"Platform berbayar tingkat tinggi yang menggabungkan simulasi 3D dengan narasi cerita (gamifikasi) untuk mahasiswa dan siswa tingkat menengah.", who:"Mahasiswa & siswa tingkat menengah"},
          {name:"ChemCollective", focus:"Kimia dasar & analisis kuantitatif", desc:"Fokus pada pengayaan materi kimia dasar dan analisis kuantitatif larutan berbasis web.", who:"Pembelajaran kimia berbasis web"},
          {name:"Rumah Belajar Kemendikbudristek", focus:"Platform nasional Indonesia", desc:"Platform nasional Indonesia yang menyediakan modul praktikum maya gratis sesuai kurikulum pendidikan Indonesia.", who:"Sesuai kurikulum pendidikan Indonesia"}
        ]}
      ]},
    { id:"kesimpulan", number:8, title:"Kesimpulan & Rekomendasi Integrasi", tagline:"Blended Learning sebagai metode integrasi yang paling efektif.",
      blocks:[
        {type:"highlight", tag:"Metode Terbaik", title:"Blended Learning (Pendekatan Kombinasi)", text:"Laboratorium maya paling efektif jika tidak digunakan sebagai pengganti total laboratorium fisik, melainkan sebagai pra-praktikum. Siswa memahami konsep, skenario, dan perhitungan di lab maya terlebih dahulu, lalu mengasah keterampilan psikomotorik dan rasa taktil di lab fisik nyata."},
        {type:"cflow", nodes:["Laboratorium Maya","Pemahaman Konsep","Eksplorasi & Simulasi","Persiapan Praktikum","Laboratorium Fisik","Keterampilan Psikomotorik & Taktil"], emph:[0,4]},
        {type:"p", text:"Rekomendasi: integrasikan laboratorium maya di tahap pra-praktikum untuk membangun pemahaman konsep secara aman dan berulang, kemudian lanjutkan ke laboratorium fisik agar siswa tetap memperoleh keterampilan motorik dan pengalaman taktil yang hanya bisa didapat dari alat dan bahan nyata."}
      ]}
  ],
  quiz:[
    {section:1, q:"Apa yang dimaksud dengan Laboratorium Maya menurut materi?", options:["Platform simulasi digital pengganti eksperimen fisik","Aplikasi media sosial untuk pelajar","Sistem penilaian otomatis sekolah","Perangkat lunak akuntansi laboratorium"], correct:0, explain:"Laboratorium Maya adalah platform perangkat lunak interaktif berbasis multimedia dan simulasi digital yang merancang ulang eksperimen fisik menjadi pengalaman virtual."},
    {section:1, q:"Manakah yang BUKAN merupakan konsep utama Laboratorium Maya?", options:["Manipulasi variabel","Mengurangi risiko material","Menghasilkan keuntungan finansial langsung","Menganalisis output visual dan matematis"], correct:2, explain:"Konsep utama Laboratorium Maya berfokus pada manipulasi variabel, analisis output, dan pengurangan risiko material — bukan pada keuntungan finansial."},
    {section:2, q:"Teori Konstruktivisme dalam Laboratorium Maya dikembangkan oleh...?", options:["John Sweller","Jean Piaget & Lev Vygotsky","Allan Paivio","Charles Darwin"], correct:1, explain:"Teori Konstruktivisme dikemukakan oleh Jean Piaget & Lev Vygotsky, menekankan bahwa pengetahuan dibangun aktif melalui pengalaman langsung."},
    {section:2, q:"Teori Beban Kognitif (Cognitive Load Theory) dikemukakan oleh...?", options:["Allan Paivio","Lev Vygotsky","John Sweller","Jean Piaget"], correct:2, explain:"Cognitive Load Theory dikemukakan oleh John Sweller, menjelaskan bagaimana lab maya mengurangi beban kognitif tak relevan (extraneous cognitive load)."},
    {section:3, q:"Manakah komponen yang bertugas menghitung data sesuai rumus ilmiah dunia nyata?", options:["Input Layer","Computational Engine","Output Layer","Feedback System"], correct:1, explain:"Computational Engine adalah otak dari simulasi yang memproses algoritma ilmiah seperti Hukum Ohm atau Hukum Gravitasi Newton."},

    {section:4, q:"Dalam hal keterampilan motorik, Laboratorium Maya...?", options:["Lebih unggul dari lab fisik","Sama baiknya dengan lab fisik","Tidak melatih keterampilan motorik sama sekali","Menggantikan kebutuhan lab fisik sepenuhnya"], correct:2, explain:"Laboratorium Maya tidak melatih keterampilan motorik — ia hanya melatih interaksi digital seperti klik dan drag, berbeda dengan lab fisik yang melatih koordinasi tangan."},
    {section:5, q:"Simulasi yang menggunakan perangkat seperti Oculus/Meta Quest termasuk kategori...?", options:["Simulasi 2D Interaktif","Remote Laboratory","Simulasi 3D & Virtual Reality","Laboratorium Fisik Konvensional"], correct:2, explain:"Simulasi 3D & Virtual Reality menggunakan perangkat keras VR seperti Oculus/Meta Quest untuk menciptakan rasa immersion."},
    {section:5, q:"Remote Laboratory memungkinkan siswa untuk...?", options:["Mengendalikan alat fisik sungguhan dari jarak jauh","Hanya melihat gambar statis alat lab","Membeli alat laboratorium secara online","Bermain simulasi tanpa alat nyata sama sekali"], correct:0, explain:"Remote Laboratory menggabungkan dunia fisik dan digital — siswa mengendalikan alat fisik sungguhan dari rumah melalui internet dan kamera live streaming."},
    {section:6, q:"Diseksi hewan virtual merupakan penerapan Laboratorium Maya pada bidang...?", options:["Teknik & Rekayasa","Kimia","Biologi & Kedokteran","Fisika"], correct:2, explain:"Diseksi hewan virtual, genetika, dan anatomi manusia 3D termasuk penerapan pada bidang Biologi & Kedokteran."},
    {section:6, q:"Manipulasi konstanta alam seperti gravitasi termasuk penerapan pada bidang...?", options:["Fisika","Kimia","Biologi","Teknik"], correct:0, explain:"Fisika (Virtual Physics Lab) mengizinkan manipulasi konstanta alam, misalnya menghilangkan gesekan udara atau mengubah percepatan gravitasi."},
    {section:7, q:"Platform yang dikembangkan oleh University of Colorado Boulder dan bersifat open-source adalah...?", options:["Labster","PhET Interactive Simulations","ChemCollective","Rumah Belajar"], correct:1, explain:"PhET Interactive Simulations dikembangkan oleh University of Colorado Boulder, gratis dan open-source."},

    {section:8, q:"Metode yang direkomendasikan sebagai integrasi terbaik adalah...?", options:["Menghapus lab fisik sepenuhnya","Blended Learning","Hanya menggunakan lab maya","Menghapus lab maya sepenuhnya"], correct:1, explain:"Blended Learning (pendekatan kombinasi) direkomendasikan sebagai metode integrasi terbaik antara lab maya dan lab fisik."},
    {section:8, q:"Menurut kesimpulan, laboratorium maya paling tepat digunakan sebagai...?", options:["Pengganti total laboratorium fisik","Pra-praktikum sebelum ke lab fisik","Ujian akhir semester","Hiburan semata"], correct:1, explain:"Laboratorium maya paling efektif digunakan sebagai pra-praktikum, bukan pengganti total laboratorium fisik."}
  ]

  sections:[
    { id:"pengertian", number:1, title:"Concept & Conceptual Definition", tagline:"Understanding the basic concept of a virtual laboratory.",
      blocks:[
        {type:"p", text:"A Virtual Laboratory is an interactive, multimedia-based software platform built on digital simulation that redesigns the environment, equipment, and procedures of physical experiments into a virtual experience. Through such a platform, users can manipulate variables, trigger reactions, and analyze both visual and mathematical output, unconstrained by physical space or material risk."},
        {type:"list", items:["Freely manipulate experimental variables","Trigger reactions and observe the results directly","Analyze visual output (graphs, animations, color changes)","Analyze mathematical output (data, figures, formulas)","No constraint from physical space or time","Reduced material risk — hazardous substances or expensive equipment"]},
        {type:"p", text:"A virtual laboratory acts as a bridge connecting abstract scientific theory with empirical proof. Instead of merely reading formulas or viewing static illustrations in a textbook, the user takes an active role as an experimenter inside a digital ecosystem."},
        {type:"flow", compact:true, steps:[
          {label:"Abstract Scientific Theory", desc:"Formulas, laws, and concepts that would otherwise only be read in a textbook."},
          {label:"Virtual Laboratory", desc:"A simulation space where the user manipulates variables and triggers reactions."},
          {label:"Empirical Proof", desc:"The user takes an active role as an experimenter, rather than a passive reader."}
        ]}
      ]},
    { id:"landasan", number:2, title:"Theoretical Foundations & Pedagogical Framework", tagline:"The learning theories that underpin the use of virtual laboratories.",
      blocks:[
        {type:"p", text:"The use of virtual laboratories in modern education rests on several leading learning theories that explain how humans process information cognitively. Tap each card to read its full explanation."},
        {type:"theoryCards", cards:[
          {letter:"A", title:"Constructivism Theory", who:"Jean Piaget & Lev Vygotsky", text:"The constructivist approach holds that knowledge is actively built by the learner through direct experience, rather than passively transferred. In a virtual laboratory, students carry out inquiry-based learning: forming hypotheses, changing parameters, experiencing failure or error with no physical consequence, and discovering natural laws independently."},
          {letter:"B", title:"Cognitive Load Theory", who:"John Sweller", text:"In a conventional physical laboratory, a student's working-memory capacity is often overloaded by manual complexity: how to hold a pipette correctly, worry about breaking expensive glassware, or fear of toxic substances. A virtual lab minimizes this 'extraneous cognitive load' so that working memory can be devoted fully to 'germane cognitive load' — understanding the core scientific concept."},
          {letter:"C", title:"Dual Coding Theory", who:"Allan Paivio", text:"The human brain processes information through two separate channels: verbal/text and visual/spatial. A virtual laboratory engages both channels at once — presenting formula text and numbers alongside real-time graphs and physical/chemical reaction animations — which significantly improves long-term retention."}
        ]},
        {type:"flow", compact:true, steps:[
          {label:"Learning Theory", desc:"Constructivism, Cognitive Load, and Dual Coding as the design foundation."},
          {label:"User Activity", desc:"Forming hypotheses, manipulating parameters, reading text and visuals simultaneously."},
          {label:"Learning Outcome", desc:"Deeper conceptual understanding and stronger long-term retention."}
        ]}
      ]},
    { id:"arsitektur", number:3, title:"Component Architecture & Simulation Workflow", tagline:"Four functional components working together in every simulation.",
      blocks:[
        {type:"p", text:"Every effective virtual laboratory application consists of four integrated functional components. Tap each stage to see its explanation."},
        {type:"flow", steps:[
          {label:"Input Layer (Independent Variables)", desc:"The interface through which the user enters test parameters — sliding a temperature slider, choosing a solution type, adjusting a pendulum's string length, or changing electrical resistance."},
          {label:"Computational Engine (Mathematical & Physics Model)", desc:"The brain of the simulation that processes scientific algorithms. It computes data according to real-world formulas such as Ohm's Law, the Ideal Gas Equation, or Newton's Law of Gravitation."},
          {label:"Output Layer (Visual & Data Representation)", desc:"Calculation results are translated into dynamic visualization (color changes, sparks, wave motion) plus continuously updating real-time graphs or data tables."},
          {label:"Feedback System (Feedback & Evaluation)", desc:"A smart guidance system that warns the user when a procedure is performed incorrectly, or poses reflective questions to test understanding."},
          {label:"User", desc:"The user receives feedback, adjusts variables back at the Input Layer, and the simulation cycle continues."}
        ]}
      ]},
    { id:"komparasi", number:4, title:"Comprehensive Comparison: Virtual Lab vs. Physical Lab", tagline:"A thorough comparison across seven key indicators.",
      blocks:[
        {type:"p", text:"The table below compares the conventional Physical Laboratory with the Virtual Laboratory across seven indicators."},
        {type:"compare", rows:[
          {label:"Safety", physical:"At risk (exposure to toxic chemicals, explosions, electric shock).", virtual:"100% safe. No risk of physical injury or safety hazards."},
          {label:"Operational Cost", physical:"Very expensive (consumables, precision equipment maintenance, building facilities).", virtual:"Very efficient (free from consumable chemical costs and broken glassware)."},
          {label:"Time Accessibility", physical:"Limited to school/campus operating hours and room availability.", virtual:"24/7, unrestricted. Accessible from anywhere, anytime, via the internet."},
          {label:"Motor Skills", physical:"Excellent. Trains hand coordination, tactile sense, and real equipment technique.", virtual:"None. Only trains digital interaction (clicking, dragging, and touch-screen input)."},
          {label:"Iteration Speed", physical:"Slow. Repeating an experiment consumes lengthy re-preparation time.", virtual:"Very fast. Experiments can be reset within milliseconds."},
          {label:"Microscopic Visualization", physical:"Limited by the optical capability of basic physical instruments.", virtual:"Very extensive. Can zoom in to atomic, molecular, and electron scale."},
          {label:"Extreme Exploration", physical:"Impossible or very difficult (e.g., simulating gravity on Mars).", virtual:"Very easy. Environmental parameters can be changed to any extreme condition."}
        ]}
      ]},
    { id:"taksonomi", number:5, title:"Taxonomy & Classification of Virtual Laboratories", tagline:"Three main categories based on technology and level of interactivity.",
      blocks:[
        {type:"p", text:"Virtual laboratories can be classified into the following three broad categories."},
        {type:"taxonomy", items:[
          {letter:"A", title:"Interactive 2D Simulation", desc:"Based on two-dimensional graphics, focused on fast loading and mathematical clarity. Users interact with simple graphical elements such as sliders, checkboxes, and buttons.", tags:["Sliders & checkboxes","Fast loading","Basic physics & math concepts"]},
          {letter:"B", title:"3D Simulation & Virtual Reality (VR)", desc:"Uses high-level three-dimensional modeling or VR hardware (such as Oculus/Meta Quest). This type creates a sense of 'immersion', where the user feels present inside a real physical laboratory and interacts with 3D equipment spatially.", tags:["VR hardware (Oculus/Meta Quest)","Spatial interaction","High immersion"]},
          {letter:"C", title:"Remote Laboratory", desc:"Combines the physical and digital worlds. Real laboratory equipment is placed at a physical location (e.g., a university lab room), and students control it from home over the internet, monitoring the equipment's movement via live-streaming camera.", tags:["Real physical equipment","Internet-based control","Live-streaming camera"]}
        ]}
      ]},
    { id:"penerapan", number:6, title:"In-Depth Cross-Disciplinary Applications", tagline:"Four major fields of study that make use of virtual laboratories.",
      blocks:[

/* ============================================================
   <!-- THEME -->
   Light / Dark / System, applied via a data-theme attribute on <html>
   so every surface (cards, nav, drawer, buttons, search, quiz, AI,
   modal, footer, table, popup) restyles through the CSS variables above.
   ============================================================ */
function resolveTheme(){
  if(state.themeMode==="dark") return "dark";
  if(state.themeMode==="light") return "light";
  try{ return (matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  catch(e){ return "light"; }
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", resolveTheme());
}
try{
  if(matchMedia){
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{
      if(state.themeMode==="system"){ applyTheme(); }
    });
  }
}catch(e){ /* matchMedia change listener unsupported — system option still works on load */ }

/* ============================================================
   <!-- MEMORY -->
   LaMa AI memory system. Light memory persisted via localStorage;
   active conversation kept in-memory only (session scope).
   ============================================================ */
const MEMORY_KEY = "lama_memory_v1";
const DISCLAIMER_KEY = "lama_disclaimer_ack";
const SOUND_KEY = "lama_sound_on";
const HAPTIC_KEY = "lama_haptic_on";
const LANG_KEY = "lama_lang";
const REDUCED_MOTION_KEY = "lama_reduced_motion";
const THEME_KEY = "lama_theme_mode";

function defaultMemory(){
  return { userName:null, activeTopic:null, currentSection:null, currentSectionTitle:null,
           instructionStyle:{simple:false, short:false, useExamples:false},
           quizHistory:null, wrongConceptCounts:{}, visitedSections:[] };
}
let memory = defaultMemory();

function loadMemory(){
  try{
    const raw = localStorage.getItem(MEMORY_KEY);
    if(raw){ memory = Object.assign(defaultMemory(), JSON.parse(raw)); }
  }catch(e){ /* corrupted or unavailable storage — start fresh, do not crash */ memory = defaultMemory(); }
  try{ const s = localStorage.getItem(SOUND_KEY); if(s!==null) state.soundOn = s==="1"; }catch(e){}
  try{ const h = localStorage.getItem(HAPTIC_KEY); if(h!==null) state.hapticOn = h==="1"; }catch(e){}
  try{ const l = localStorage.getItem(LANG_KEY); if(l==="id"||l==="en") state.lang = l; }catch(e){}
  try{ const r = localStorage.getItem(REDUCED_MOTION_KEY); if(r!==null) state.reducedMotion = r==="1"; }catch(e){}
  try{ const th = localStorage.getItem(THEME_KEY); if(th==="light"||th==="dark"||th==="system") state.themeMode = th; }catch(e){}
  try{ state.disclaimerSeen = localStorage.getItem(DISCLAIMER_KEY)==="1"; }catch(e){}
  applyTheme();
}
function persistMemory(){
  try{ localStorage.setItem(MEMORY_KEY, JSON.stringify(memory)); }catch(e){ /* storage unavailable — memory stays session-only */ }
}
function persistSetting(key, value){
  try{ localStorage.setItem(key, value); }catch(e){}
}
function resetMemory(){
  memory = defaultMemory();
  try{ localStorage.removeItem(MEMORY_KEY); }catch(e){}
  state.ai.messages = [];
}
function setActiveTopic(topic, section){
  memory.activeTopic = topic;
  if(section){ memory.currentSection = section.number; memory.currentSectionTitle = section.title; }
  persistMemory();
}
function applyReducedMotion(){
  document.documentElement.style.setProperty("--dur-1", state.reducedMotion?"1ms":"180ms");
  document.documentElement.style.setProperty("--dur-2", state.reducedMotion?"1ms":"420ms");
}

   <!-- SEARCH -->
   ============================================================ */
const searchIndexCache = {};
function stripTags(html){ return html.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim(); }
function sectionSearchText(section){
  let parts = [section.title, section.tagline];
  section.blocks.forEach(b=>{
    if(b.type==="p") parts.push(b.text);
    if(b.type==="list") parts.push(b.items.join(" "));
    if(b.type==="theoryCards") b.cards.forEach(c=>parts.push(c.title,c.who,c.text));
    if(b.type==="flow") b.steps.forEach(s=>parts.push(s.label,s.desc));
    if(b.type==="compare") b.rows.forEach(r=>parts.push(r.label,r.physical,r.virtual));
    if(b.type==="taxonomy") b.items.forEach(t=>parts.push(t.title,t.desc,(t.tags||[]).join(" ")));
    if(b.type==="disciplines") b.items.forEach(x=>parts.push(x.title,x.items.join(" ")));
    if(b.type==="platforms") b.items.forEach(x=>parts.push(x.name,x.focus,x.desc,x.who));
    if(b.type==="highlight") parts.push(b.tag,b.title,b.text);
    if(b.type==="cflow") parts.push(b.nodes.join(" "));
  });
  return parts.join(" ");
}
function getSearchIndex(){
  if(searchIndexCache[state.lang]) return searchIndexCache[state.lang];
  const idx = d().sections.map(s=>({section:s, text:sectionSearchText(s)}));
  searchIndexCache[state.lang]=idx;
  return idx;
}
function escapeHtml(str){ return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function searchKnowledge(query){
  const q = (query||"").trim().toLowerCase();
  if(!q) return [];
  const idx = getSearchIndex();
  const results=[];
  idx.forEach(entry=>{
    const lower = entry.text.toLowerCase();
    const pos = lower.indexOf(q);
    if(pos!==-1){
      const start = Math.max(0,pos-40);
      const end = Math.min(entry.text.length,pos+q.length+60);
      let snip = entry.text.slice(start,end);
      if(start>0) snip="…"+snip;
      if(end<entry.text.length) snip=snip+"…";
      const re = new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
      snip = escapeHtml(snip).replace(re, m=>`<mark>${m}</mark>`);
      results.push({section:entry.section, snip});
    }
  });
  return results;
}
function runSearch(query){ return searchKnowledge(query); }

/* ============================================================
   <!-- QUIZ ENGINE (Quizeru) -->
   ============================================================ */
const QUIZ_MODES = { easy:5, medium:10, hard:15 };
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickQuestionsForMode(mode){
  const bank = d().quiz;
  const need = QUIZ_MODES[mode] || 10;
  const tierOrder = mode==="easy" ? ["easy","medium","hard"] : mode==="medium" ? ["medium","easy","hard"] : ["hard","medium","easy"];
  let pool = [];
  const usedIds = new Set();
  tierOrder.forEach(tier=>{
    shuffleArr(bank.filter(q=>q.difficulty===tier)).forEach(q=>{
      if(!usedIds.has(q.id) && pool.length<need){ pool.push(q); usedIds.add(q.id); }
    });
  });
  return shuffleArr(pool).slice(0, need);
}
/* generateQuestion(mode, context) — local fallback question generator.
   No external AI API is configured (see AI_CONFIG below), so this always
   sources from the local, document-grounded question bank. */
function generateQuestion(mode, context){
  const qs = pickQuestionsForMode(mode);
  return qs;
}
function startQuiz(mode){
  const rawQs = generateQuestion(mode, {memory});
  const questions = rawQs.map(q=>{
    const letters=["A","B","C","D"];
    const order = shuffleArr(letters.map((_,i)=>i));
    const options = order.map(i=>q.options[i]);
    const correctIndex = order.indexOf(q.correct);
    return { ...q, options, correctIndex };
  });
  state.quiz = { stage:"question", mode, questions, index:0, correct:0, wrong:0, answered:false, selected:null, wrongTopics:[] };
  navigate({view:"quiz"});
}
function answerQuizOption(optIndex){
  const qz = state.quiz;
  if(qz.answered) return;
  const q = qz.questions[qz.index];
  qz.answered = true;
  qz.selected = optIndex;
  const isCorrect = optIndex===q.correctIndex;
  if(isCorrect){
    qz.correct++;
    playSuccessSound();
    triggerHaptic();
    showCelebrateToast();
  } else {
    qz.wrong++;
    const section = d().sections.find(s=>s.number===q.section);
    qz.wrongTopics.push(section ? section.title : ("Bagian "+q.section));
    memory.wrongConceptCounts[q.section] = (memory.wrongConceptCounts[q.section]||0)+1;
    persistMemory();
  }
  render();
}
function nextQuizQuestion(){
  const qz = state.quiz;
  if(qz.index < qz.questions.length-1){
    qz.index++; qz.answered=false; qz.selected=null;
    render();
  } else {
    finishQuiz();
  }
}
function finishQuiz(){
  const qz = state.quiz;
  const total = qz.questions.length;
  const score = Math.round((qz.correct/total)*100);
  const topics = [...new Set(qz.questions.map(q=>{
    const s = d().sections.find(sec=>sec.number===q.section); return s?s.title:"";
  }))];
  memory.quizHistory = { mode:qz.mode, total, correct:qz.correct, wrong:qz.wrong, score, topics, wrongQuestions:[...new Set(qz.wrongTopics)] };
  persistMemory();
  qz.stage = "result";
  render();
}
function scoreCategory(score){
  const t = ui();
  if(score>=90) return t.quizCat90;
  if(score>=70) return t.quizCat70;
  if(score>=50) return t.quizCat50;
  return t.quizCat0;
}

/* ============================================================
   <!-- AUDIO -->  (Web Audio API — no external audio files)
   ============================================================ */
let audioCtx = null;
function getAudioCtx(){
  if(!state.soundOn) return null;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; } // Web Audio unsupported or blocked — fail silently
}
function playSuccessSound(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const now = ctx.currentTime;
    [523.25, 783.99].forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const t0 = now + i*0.09;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.14, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0); osc.stop(t0+0.24);
    });
  }catch(e){ /* audio blocked by browser — no-op */ }
}

/* ============================================================
   <!-- HAPTIC -->
   ============================================================ */
function triggerHaptic(){
  if(!state.hapticOn) return;
  try{ if(navigator.vibrate) navigator.vibrate(45); }catch(e){ /* unsupported — no-op */ }
}

/* ============================================================
   <!-- AI ENGINE -->
   LaMa AI: source-grounded, memory-aware local knowledge engine.
   Functions required by spec: answerQuestion, searchKnowledge,
   findRelevantSection, generateFallbackResponse, isAllowedTopic.
   ============================================================ */
function findRelevantSection(query){
  const results = searchKnowledge(query);
  return results.length>0 ? results[0].section : null;
}
function looseTopicOverlap(query){
  const idx = getSearchIndex();
  const words = query.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(w=>w.length>=4);
  if(words.length===0) return false;
  // Require at least two distinct matching domain terms so a single
  // incidental common word (e.g. a country name) doesn't count as
  // genuine topical overlap for an otherwise off-topic question.
  const matched = new Set();
  idx.forEach(entry=>{
    const lower = entry.text.toLowerCase();
    words.forEach(w=>{
      if(matched.has(w)) return;
      const re = new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b");
      if(re.test(lower)) matched.add(w);
    });
  });
  return matched.size>=2;
}
function extractExample(section){
  for(const b of section.blocks){
    if(b.type==="list") return b.items[0];
    if(b.type==="theoryCards") return b.cards[0].title+" ("+b.cards[0].who+")";
    if(b.type==="flow") return b.steps[0].label;
    if(b.type==="compare") return b.rows[0].label;
    if(b.type==="taxonomy") return b.items[0].title;
    if(b.type==="disciplines") return b.items[0].items[0];
    if(b.type==="platforms") return b.items[0].name;
    if(b.type==="cflow") return b.nodes[0];
  }
  return section.tagline;
}
function detectName(q){
  const pats = [/panggil (saya|aku) ([a-zA-Z]{2,20})/i, /nama saya ([a-zA-Z]{2,20})/i, /call me ([a-zA-Z]{2,20})/i, /my name is ([a-zA-Z]{2,20})/i];
  for(const p of pats){ const m=q.match(p); if(m) return m[m.length-1]; }
  return null;
}
function detectInstruction(q){
  const flags={};
  if(/bahasa (yang )?sederhana|sederhanakan|simple language|explain (it )?simply/i.test(q)) flags.simple=true;
  if(/jawab (yang )?singkat|singkat saja|ringkas saja|short answer|be brief|keep it short/i.test(q)) flags.short=true;
  if(/pakai contoh|gunakan contoh|beri(kan)? contoh|use examples|give (me )?an example|with examples/i.test(q)) flags.useExamples=true;
  return flags;
}
function isGreeting(q){ return /^\s*(hai+|halo+|hello|hi|hey|selamat (pagi|siang|sore|malam))\b/i.test(q); }
function isCreatorQuestion(q){ return /siapa (yang )?(membuat|pembuat|bikin|mengembangkan).*(website|web|aplikasi|app)|pembuat (website|web|aplikasi) ini|dibuat oleh siapa|bagaimana (website|web) ini dibuat|who (made|built|created|developed) this (website|site|app)/i.test(q); }
function isTechStackQuestion(q){ return /dibuat (pakai|menggunakan)( bahasa)? apa|bahasa pemrograman apa|teknologi apa (yang )?digunakan|stack (website|web)? ?apa|coding.?nya pakai apa|dibuat menggunakan bahasa apa|what (language|tech|stack|technology).*(built|made|use)|built (with|using) what|what technology/i.test(q); }
function isQuizHistoryQuestion(q){ return /salah (apa|dimana|pada)|apa (yang )?(tadi )?saya salah|skor (saya|quiz)|hasil quiz|what did i get wrong|my score|quiz result/i.test(q); }
/* Fully expanded creator + tool credits (§21 Kategori 3, §64, §78, §80). */
function creatorAnswerText(){
  const isId = state.lang==='id';
  const lines = SITE.team.map(m => isId ? `${m.id} — ${m.noteId}` : `${m.en} — ${m.noteEn}`);
  const intro = isId
    ? `${SITE.name} dikembangkan oleh ${SITE.author} (GitHub: ${SITE.github}), dengan bantuan beberapa tools dan AI:`
    : `${SITE.name} was developed by ${SITE.author} (GitHub: ${SITE.github}), with help from a few tools and AI systems:`;
  return intro + "\n" + lines.map(l=>"• "+l).join("\n");
}
/* Technology-stack summary (§71–§73, §77). */
function techAnswerText(){
  const isId = state.lang==='id';
  return isId
    ? `${SITE.name} dibuat menggunakan ${SITE.tech.html}, ${SITE.tech.css}, dan ${SITE.tech.js} dalam satu file ${SITE.mainFile}. Website ini juga memanfaatkan ${SITE.tech.apis[0]} untuk efek suara, ${SITE.tech.apis[1]} untuk getaran saat jawaban benar, dan ${SITE.tech.apis[2]} untuk menyimpan tema, bahasa, progress belajar, memory LaMa AI, serta riwayat Quizeru.`
    : `${SITE.name} is built with ${SITE.tech.html}, ${SITE.tech.css}, and ${SITE.tech.js}, all inside a single ${SITE.mainFile} file. It also uses the ${SITE.tech.apis[0]} for sound effects, the ${SITE.tech.apis[1]} for haptic feedback on correct answers, and ${SITE.tech.apis[2]} to store theme, language, learning progress, LaMa AI memory, and Quizeru history.`;
}
function creatorAndTechAnswerText(){
  return creatorAnswerText() + "\n\n" + techAnswerText();
}
function isPronounAmbiguous(q){
  const words = q.trim().split(/\s+/);
  return words.length<=9 && /\b(itu|ini|tadi|that|this|it)\b/i.test(q);
}
function generateFallbackResponse(section, query){
  const t = ui();
  let base;
  if(memory.instructionStyle.short){
    base = section.tagline;
  } else {
    const firstP = section.blocks.find(b=>b.type==="p");
    base = firstP ? firstP.text : section.tagline;
    if(base.length>320) base = base.slice(0,300).replace(/\s+\S*$/,"")+"…";
  }
  let text = base + " " + t.aiRefSuffix(section);
  if(memory.instructionStyle.useExamples){
    const ex = extractExample(section);
    text += (state.lang==="id" ? " Contoh: " : " Example: ") + ex + ".";
  }
  return text;
}
function isAllowedTopic(query){
  return !!findRelevantSection(query) || looseTopicOverlap(query) || isCreatorQuestion(query) || isTechStackQuestion(query) || isGreeting(query);
}
function answerQuestion(raw){
  const t = ui();
  const query = (raw||"").trim();
  if(!query) return { text: t.aiWelcome };

  const name = detectName(query);
  if(name){
    memory.userName = name.charAt(0).toUpperCase()+name.slice(1);
    persistMemory();
    return { text: state.lang==="id" ? `Baik, ${memory.userName}.` : `Got it, ${memory.userName}.` };
  }

  const flags = detectInstruction(query);
  const hasInstruction = Object.keys(flags).length>0;
  if(hasInstruction){ memory.instructionStyle = Object.assign({}, memory.instructionStyle, flags); persistMemory(); }

  if(isCreatorQuestion(query) && isTechStackQuestion(query)) return { text: creatorAndTechAnswerText() };
  if(isCreatorQuestion(query)) return { text: creatorAnswerText() };
  if(isTechStackQuestion(query)) return { text: techAnswerText() };

  if(isQuizHistoryQuestion(query)){
    const qh = memory.quizHistory;
    if(!qh) return { text: state.lang==="id" ? "Kamu belum menyelesaikan sesi Quizeru mana pun, jadi belum ada riwayat yang bisa saya rangkum." : "You haven't completed a Quizeru session yet, so there's no history for me to summarize." };
    const wrongList = qh.wrongQuestions.length ? qh.wrongQuestions.join(", ") : (state.lang==="id"?"tidak ada":"none");
    const text = state.lang==="id"
      ? `Pada sesi Quizeru mode ${qh.mode} terakhir, skor kamu ${qh.score}% (${qh.correct} benar, ${qh.wrong} salah). Kamu sempat salah pada topik: ${wrongList}.`
      : `In your last Quizeru session (${qh.mode} mode), your score was ${qh.score}% (${qh.correct} correct, ${qh.wrong} wrong). You missed questions related to: ${wrongList}.`;
    return { text };
  }

  if(isGreeting(query) && query.split(/\s+/).length<=5){
    const hi = memory.userName ? (state.lang==="id"?`Halo, ${memory.userName}!`:`Hi, ${memory.userName}!`) : (state.lang==="id"?"Halo!":"Hi!");
    return { text: hi + " " + t.aiWelcome };
  }

  const strippedForQuestion = query.replace(/panggil (saya|aku) [a-zA-Z]+|nama saya [a-zA-Z]+|call me [a-zA-Z]+|my name is [a-zA-Z]+/ig,"").trim();
  if(hasInstruction && strippedForQuestion.length<8){
    return { text: state.lang==="id" ? "Baik, saya akan menyesuaikan gaya jawaban saya mulai sekarang." : "Got it — I'll adjust my answers accordingly from now on." };
  }

  let effectiveQuery = query;
  if(isPronounAmbiguous(query) && memory.activeTopic) effectiveQuery = memory.activeTopic;

  let section = findRelevantSection(effectiveQuery);
  if(!section && effectiveQuery!==query) section = findRelevantSection(query);

  if(section){
    setActiveTopic(section.title, section);
    return { text: generateFallbackResponse(section, query), section };
  }
  if(looseTopicOverlap(query)) return { text: t.aiNotFound };
  return { text: t.aiOutOfScope };
}

/* AIProvider — abstraction layer so a real AI API could later replace the
   local engine without changing the UI. No API key is embedded here;
   apiEndpoint stays null until a backend proxy is configured. */
const AI_CONFIG = { apiEndpoint: null, note: "Configure a backend proxy endpoint here. Never embed a real API key in frontend code." };
const AIProvider = {
  generateAIResponse(query){
    if(AI_CONFIG.apiEndpoint){
      // Placeholder branch for a real API call — unreachable while
      // apiEndpoint is null, so the local fallback engine is always used.
      return { text: ui().aiApiDown };
    }
    return answerQuestion(query);
  },
  generateAIQuestion(mode){ return generateQuestion(mode, {memory}); },
  evaluateAnswer(question, selectedIndex){ return selectedIndex === question.correctIndex; },
  isAllowedTopic(query){ return isAllowedTopic(query); }
};

/* conversation memory (session-only, capped) */
function addAiMessage(role, text, meta){
  state.ai.messages.push(Object.assign({role, content:text, timestamp:Date.now()}, meta||{}));
  if(state.ai.messages.length>40){
    const removed = state.ai.messages.splice(0, state.ai.messages.length-40);
    memory.conversationSummary = (state.lang==="id" ? "Percakapan sebelumnya membahas: " : "Earlier conversation covered: ") +
      (memory.activeTopic || (state.lang==="id" ? "berbagai topik Laboratorium Maya" : "various Laboratorium Maya topics")) + ".";
    persistMemory();
  }
}
function sendAiMessage(text){
  const query = text.trim();
  if(!query) return;
  addAiMessage("user", query);
  state.ai.typing = true;
  render();
  const delay = 500 + Math.random()*500;
  setTimeout(()=>{
    const result = AIProvider.generateAIResponse(query);
    state.ai.typing = false;
    addAiMessage("assistant", result.text, result.section ? {srcSection:result.section.number} : {});
    render();
    scrollAiToBottom();
  }, delay);
}
function scrollAiToBottom(){
  const el = document.getElementById("ai-messages");
  if(el) el.scrollTop = el.scrollHeight;
}

function navigate(route, dir){
  const applyNav = ()=>{
    state.route = route;
    state.drawerOpen=false;
    state.searchOpen=false;
    render();
    window.scrollTo({top:0, behavior: (state.reducedMotion || dir) ? "auto" : "smooth"});
  };
  const canTransition = dir && !state.reducedMotion && typeof document.startViewTransition === "function";
  if(canTransition){
    document.documentElement.setAttribute("data-transition-dir", dir);
    const vt = document.startViewTransition(applyNav);
    vt.finished.finally(()=>document.documentElement.removeAttribute("data-transition-dir"));
  } else {
    applyNav();
  }
}
function goSection(number, dir, mode){
  const direction = dir || (state.route.view==="section" ? (number>state.route.number ? "next" : "prev") : "next");
  const resolvedMode = mode || (state.route.view==="section" ? state.route.mode : "browse") || "browse";
  navigate({view:"section", number, mode:resolvedMode}, direction);
}
